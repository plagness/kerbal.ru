// kerbal.ru «Оператор» — «тихие» ачивки-контракты за орбитальную сборку (станцию).
//
// Синтаксис и сама конструкция (VesselParameterGroup + Orbit + PartValidation + Duration) —
// дословно по образцу уже установленного и переведённого контракта из ContractConfigurator-
// KerbinSpaceStation (GameData/ContractPacks/KerbinSpaceStation/StationMissions/
// StationCoreCombined.cfg) — рабочий, проверенный паттерн, не изобретён с нуля. Не требуем
// экипажа (HasCrewCapacity) — сборка «Оператор» принципиально беспилотная, станция тоже может
// быть исследовательским постом без экипажа.
//
// Duration = 2 дня — та же защита от «пролётной» сборки, что и в оригинале: части должны быть
// собраны В ОДНУ орбитальную группу и провисеть на орбите некоторое время, а не просто мгновенно
// пролететь мимо друг друга при стыковке.
//
// «Тихий» = autoAccept, нулевые награды/штрафы, maxCompletions=1, deadline=0 — контракт навсегда
// остаётся в Mission Control во вкладке «Завершено» как персистентная метка.
//
// :NEEDS[ContractConfigurator] — no-op, если мод не установлен.

CONTRACT_TYPE:NEEDS[ContractConfigurator]
{
	name = kerbalru_operator_station_first
	title = Первый орбитальный узел
	group = kerbalruOperatorAchievements
	agent = Оператор
	synopsis = Собрать на орбите Кербина связку не менее чем из 10 деталей с хотя бы одним стыковочным узлом
	completedMessage = Первый орбитальный узел собран и держится на орбите.
	minExpiry = 1
	maxExpiry = 1000
	deadline = 0
	maxCompletions = 1
	autoAccept = true
	cancellable = false
	declinable = false
	targetBody = Kerbin
	rewardScience = 0
	rewardReputation = 0
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0
	advanceFunds = 0

	PARAMETER
	{
		name = NewOutpost
		type = VesselParameterGroup
		title = Собрать связку не менее чем из 10 деталей на орбите Кербина хотя бы с одним стыковочным узлом

		PARAMETER
		{
			name = LKO
			type = Orbit
			targetBody = Kerbin
			situation = ORBITING
		}
		PARAMETER
		{
			name = HasDockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 1
		}
		PARAMETER
		{
			name = MinParts
			type = PartValidation
			minCount = 10
		}
	}
	PARAMETER
	{
		name = HoldsTogether
		type = Duration
		duration = 2d
		startCriteria = PARAMETER_COMPLETION
		parameter = NewOutpost
	}
}

CONTRACT_TYPE:NEEDS[ContractConfigurator]
{
	name = kerbalru_operator_station_large
	title = Крупная станция
	group = kerbalruOperatorAchievements
	agent = Оператор
	synopsis = Собрать на орбите Кербина связку не менее чем из 25 деталей с хотя бы одним стыковочным узлом
	completedMessage = Крупная орбитальная станция собрана и держится на орбите.
	minExpiry = 1
	maxExpiry = 1000
	deadline = 0
	maxCompletions = 1
	autoAccept = true
	cancellable = false
	declinable = false
	targetBody = Kerbin
	rewardScience = 0
	rewardReputation = 0
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0
	advanceFunds = 0

	PARAMETER
	{
		name = LargeStation
		type = VesselParameterGroup
		title = Собрать связку не менее чем из 25 деталей на орбите Кербина хотя бы с одним стыковочным узлом

		PARAMETER
		{
			name = LKO
			type = Orbit
			targetBody = Kerbin
			situation = ORBITING
		}
		PARAMETER
		{
			name = HasDockingPort
			type = PartValidation
			partModule = ModuleDockingNode
			minCount = 1
		}
		PARAMETER
		{
			name = MinParts
			type = PartValidation
			minCount = 25
		}
	}
	PARAMETER
	{
		name = HoldsTogether
		type = Duration
		duration = 2d
		startCriteria = PARAMETER_COMPLETION
		parameter = LargeStation
	}
}
