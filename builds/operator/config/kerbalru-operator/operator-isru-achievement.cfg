// kerbal.ru «Оператор» — «тихая» ачивка-контракт за добычу ресурсов (ISRU).
//
// ЧЕСТНАЯ ОГОВОРКА (проверено дизассемблированием kOS.dll + грепом Assembly-CSharp.dll):
// нигде в игре — ни в стоке, ни в kOS, ни в ContractConfigurator, ни в моде Achievements —
// не существует счётчика «сколько единиц ресурса X добыто за миссию/за карьеру». Это не пробел
// перевода/конфига, а честная невозможность: добыча физически не накапливается нигде, кроме
// текущего наполнения баков (`Part.Resources`), которое дальше произвольно тратится/перекачивается.
// Настоящий трекер потребовал бы либо форка ISRU-модуля, либо самостоятельного kOS-скрипта,
// который сэмплит SHIP:RESOURCES до/после сессии и сам ведёт лог (готового такого скрипта в
// библиотеке `kos/lib/` сейчас нет — отдельная задача, не эта).
//
// Поэтому ниже — не «добыто N единиц», а ЧЕСТНЫЙ ПРОКСИ: «на борту работает переработчик руды
// (ModuleResourceHarvester реально смонтирован) И на нём накоплено не менее 500 ед. Ore, всё это
// держится не менее суток» — то есть реально действующий добывающий комплекс, а не разовая
// перекачка ресурса с другого корабля. Механически близко к тому, что просил пользователь,
// но не тождественно «намайнено N тонн» — если это неприемлемо, вариант убрать.
//
// Синтаксис (VesselParameterGroup + PartValidation + HasResource + Duration) — по образцу
// operator-station-achievements.cfg / StationCoreCombined.cfg, HasResource — из отчёта разведки
// (используется в GameData/ContractPacks/KerbinSpaceStation/StationMissions/*.cfg для Supplies).
//
// :NEEDS[ContractConfigurator] — no-op, если мод не установлен.

CONTRACT_TYPE:NEEDS[ContractConfigurator]
{
	name = kerbalru_operator_isru_first
	title = Добывающий комплекс
	group = kerbalruOperatorAchievements
	agent = Оператор
	synopsis = Развернуть работающий буровой комплекс (переработчик руды на борту) с запасом не менее 500 ед. руды
	completedMessage = Добывающий комплекс развёрнут и работает.
	minExpiry = 1
	maxExpiry = 1000
	deadline = 0
	maxCompletions = 1
	autoAccept = true
	cancellable = false
	declinable = false
	rewardScience = 0
	rewardReputation = 0
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0
	advanceFunds = 0

	PARAMETER
	{
		name = MiningRig
		type = VesselParameterGroup
		title = Иметь на борту работающий переработчик руды с запасом не менее 500 ед. Ore

		PARAMETER
		{
			name = HasHarvester
			type = PartValidation
			partModule = ModuleResourceHarvester
			minCount = 1
		}
		PARAMETER
		{
			name = HasOre
			type = HasResource
			resource = Ore
			minQuantity = 500.0
		}
	}
	PARAMETER
	{
		name = HoldsTogether
		type = Duration
		duration = 1d
		startCriteria = PARAMETER_COMPLETION
		parameter = MiningRig
	}
}
