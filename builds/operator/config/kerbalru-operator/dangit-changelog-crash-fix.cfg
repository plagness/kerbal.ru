// kerbal.ru «Оператор» — фикс постоянного спама NullReferenceException от KerbalChangelog
// на записи Dang It! Continued.
//
// Причина (найдено вживую по KSP.log при живом мониторинге, v26.33): GameData/DangIt/
// changelog.cfg содержит несколько узлов VERSION с историей апдейтов мода. Один из них —
// `version = 0.7.20.4 (beta)` — не является валидной версией для парсера KerbalChangelog
// (ожидает точечный числовой формат вида X.Y.Z.W, суффикс " (beta)" ломает разбор). Апстрим-
// баг Dang It!, не наш.
//
// Раньше (v26.24-v26.32) это давало ОДНО безобидное исключение при валидации версии
// (ArgumentException: Invalid version) — списано как некритичный шум. Живой мониторинг
// v26.33 показал, что это НЕ разовая ошибка: если окно чейнджлога Dang It! реально
// открывается (showChangelog=True по умолчанию), его OnGUI() падает на той же сломанной
// версии КАЖДЫЙ КАДР, пока окно видимо — 5000+ NullReferenceException за минуту, постоянный
// рост KSP.log, реальная нагрузка на систему логирования каждый фрейм.
//
// Фикс: отключаем автопоказ чейнджлога именно для этой записи (showChangelog=False).
// Сама история изменений мода никуда не девается, отключается только всплывающее окно,
// которое физически не может отрендериться без падения из-за битых данных апстрима.
// Если Dang It! когда-нибудь поправит версию в своём changelog.cfg — просто убрать этот файл.
//
// :FINAL, отсутствие узла (мод не стоит) = no-op.

@KERBALCHANGELOG:HAS[#modName[DangIt!]]:FINAL
{
	@showChangelog = False
}
