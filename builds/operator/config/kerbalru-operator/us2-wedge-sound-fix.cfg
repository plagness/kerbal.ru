// kerbal.ru «Оператор» — фикс закольцованного звука у US2-субспутника.
//
// Деталь: USAdvancedMicroSatWedge («Расширенный субспутник», Universal Storage 2).
// Это трёхрежимный микродвигатель (ЖРД / монотопливо / ион) на 2 кН — по сути
// маневровый движок спутника.
//
// Проблема 1 — дрон. Режимы liquidFuelRunning и monopropFuelRunning крутят
// РАКЕТНЫЙ клип sound_rocket_mini с loop = true, громкостью до 0.3 и высотой тона,
// привязанной к тяге (pitch 0.75 → 1.5). Как только ступень с субспутником
// активирована, а автопилот подруливает газом, тон едет вверх-вниз — на слух
// ровный назойливый цикл на весь полёт. Тот же дефект, что был у RCS Knes.
//
// Проблема 2 — битый клип. Режим IonPlume ссылается на sound_IonEngine, которого
// в GameData нет вообще:
//   Cannot assign AudioClip 'sound_IonEngine' to AudioFX
// То есть остаётся закольцованный источник звука с пустым клипом.
//
// Фикс: убираем закольцованный AUDIO у всех трёх режимов. Не трогаем:
//   - визуальный выхлоп MODEL_MULTI_PARTICLE — деталь по-прежнему видно;
//   - одноразовый звук запуска engage (sound_vent_soft, loop = false) — щелчок
//     при включении остаётся, момент запуска слышно.
// Главные двигатели сборки не затронуты.
// :FINAL — поверх мода. Отсутствие узла = no-op.

@PART[USAdvancedMicroSatWedge]:FINAL
{
	@EFFECTS
	{
		@liquidFuelRunning
		{
			!AUDIO {}
		}
		@monopropFuelRunning
		{
			!AUDIO {}
		}
		@IonPlume
		{
			!AUDIO {}
		}
	}
}
