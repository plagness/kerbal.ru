// kerbal.ru «Оператор» — фикс битого закольцованного звука у US2-субспутника.
// Проблема: у детали USAdvancedMicroSatWedge («Расширенный субспутник», Universal Storage 2)
// эффект IonPlume крутит AUDIO с клипом sound_IonEngine и loop = true, но такого клипа
// в GameData нет вообще — в логе на загрузке корабля появляется
//   Cannot assign AudioClip 'sound_IonEngine' to AudioFX
// В итоге у детали висит закольцованный источник звука с пустым клипом. Звука он не даёт,
// а поведение при каждом запуске эффекта — на совести Unity.
// Фикс: убираем только сломанный AUDIO у ионного режима. Визуальный выхлоп
// (MODEL_MULTI_PARTICLE) и звук жидкостного/монотопливного режимов не трогаем —
// их клипы существуют и работают.
// :FINAL — поверх мода. Отсутствие узла = no-op.

@PART[USAdvancedMicroSatWedge]:FINAL
{
	@EFFECTS
	{
		@IonPlume
		{
			!AUDIO {}
		}
	}
}
