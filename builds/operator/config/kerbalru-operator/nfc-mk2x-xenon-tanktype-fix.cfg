// kerbal.ru «Оператор» — фикс конфликта имён B9_TANK_TYPE "Xenon" между
// Mk2Expansion и NearFutureConstruction (NFC).
//
// Причина (найдено живым разбором GameData + GameData/ModuleManager.ConfigCache):
// Mk2Expansion/Resources/TankTypes.cfg и NearFutureConstruction/Patches/
// NFConstructionFuelTankTypes.cfg независимо объявляют B9_TANK_TYPE с ОДИНАКОВЫМ
// name = Xenon, но РАЗНЫМИ характеристиками:
//   Mk2Expansion:            tankMass = 0.001,          tankCost = 120.0,  XenonGas 30 /vol
//   NearFutureConstruction:  tankMass = 0.00123046875,  tankCost = 4.5,    XenonGas 15.75 /vol
// ModuleManager дубликаты НЕ схлопывает (оба узла целые проходят в
// ModuleManager.ConfigCache) — схлопывание делает сам плагин B9PartSwitch во
// время загрузки: он строит общий словарь tank type по имени и при повторном
// имени пишет в лог ошибку "B9TankSettings: The tank type Xenon already exists"
// и ОТБРАСЫВАЕТ второй узел. Побеждает тот, что распарсился первым — по
// алфавиту папок GameData это Mk2Expansion (M < N), что подтверждено логом
// (Config(B9_TANK_TYPE) .../Mk2Expansion/.../Xenon раньше .../NearFutureConstruction/.../Xenon
// и единственная строка "already exists" сразу после).
//
// Итог до фикса: ЛЮБАЯ деталь с tankType = Xenon — и Mk2Expansion Service Tank
// (свой, "победивший" тип — тут порядок не портит игру), И ВСЕ четыре трасса
// NearFutureConstruction (truss-hex-01/02, truss-octo-01/02) — получают
// характеристики Mk2Expansion: tankCost=120 вместо задуманных 4.5 (в 26.7 раза
// дороже) и плотность XenonGas 30/vol вместо 15.75/vol (вдвое больше газа в
// том же объёме бака) на деталях NFC, заточенных под лёгкие ионные баки Near
// Future Propulsion.
//
// Сопутствующая находка (тот же корень — общий узел по имени): patch
// NearFutureConstruction/Patches/NFConstructionFuelTankTypes.cfg содержит
//   @B9_TANK_TYPE[Xenon]:NEEDS[NearFuturePropulsion]:FOR[NearFutureConstruction]
//     { @tankMass = 0.000525 }
// — у ModuleManager узловые патчи матчатся по type+name ГЛОБАЛЬНО, без учёта
// исходного мода, поэтому при установленном NearFuturePropulsion (в «Операторе»
// стоит) этот патч задевает ОБА узла Xenon разом. Подтверждено в
// ModuleManager.ConfigCache: у узла Mk2Expansion tankMass тоже = 0.000525,
// хотя автор Mk2Expansion объявил 0.001 — то есть Mk2Expansion Service Tank
// сейчас незаметно легче задуманного (-47.5%). NearFutureExploration несёт
// собственный дубль того же патча (@B9_TANK_TYPE[Xenon]:NEEDS[NearFuturePropulsion],
// без :FOR) — он тоже бьёт по общему имени, поэтому теку по массе не убрать
// одним переименованием узла NFC; после переименования узла NFC оставшийся
// одиночный узел "Xenon" (Mk2Expansion) продолжит ловить оба совпадения по
// массе. Возвращаем массу Mk2Expansion явно, отдельным блоком ниже.
//
// Фикс:
// 1) Переименовываем узел B9_TANK_TYPE от NearFutureConstruction в NFCXenon
//    (отбор по tankCost=4.5 — однозначно отличает его от узла Mk2Expansion
//    с tankCost=120, независимо от порядка загрузки).
// 2) Перепривязываем tankType = Xenon → NFCXenon в единственном
//    ModuleB9PartSwitch каждой из 4 трасс NFC, где встречается SUBTYPE Xenon.
// 3) Возвращаем Mk2Expansion его собственную массу 0.001 (отбор по
//    tankCost=120 — второй узел Xenon к этому моменту уже переименован в
//    NFCXenon, так что селектор снова однозначен).
// Mk2Expansion и NearFutureConstruction не трогаем — правим только через
// свой патч. :FINAL — после всех обычных проходов и любых будущих
// :NEEDS[NearFuturePropulsion] патчей. Нет мода/узла = no-op.

@B9_TANK_TYPE[Xenon]:HAS[#tankCost[4.5]]:NEEDS[NearFutureConstruction]:FINAL
{
	%name = NFCXenon
}

@PART[truss-hex-01|truss-hex-02|truss-octo-01|truss-octo-02]:NEEDS[NearFutureConstruction]:FINAL
{
	@MODULE[ModuleB9PartSwitch]
	{
		@SUBTYPE[Xenon]
		{
			@tankType = NFCXenon
		}
	}
}

@B9_TANK_TYPE[Xenon]:HAS[#tankCost[120.0]]:NEEDS[Mk2Expansion]:FINAL
{
	@tankMass = 0.001
}
