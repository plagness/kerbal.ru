// kerbal.ru «Оператор» — фикс краха загрузки 24 типов контрактов Constellations
// после перехода на RemoteTech (v26.19).
//
// Причина (найдено вживую по KSP.log + исходнику ContractConfigurator на GitHub,
// source/CC_RemoteTech/HasAntennaParameter.cs): параметр PARAMETER{name=HasAntenna}
// принимает antennaType только из enum {Dish, Omni}. Контракты Constellations
// написаны с antennaType = RELAY (12 файлов в Relays/) и antennaType = EITHER
// (12 файлов в Satellites/ и KPS/) — значений, которых в этом enum никогда не было.
// Это не наш баг: до установки RemoteTech проверка версии RT в HasAntennaFactory.Load()
// не пропускала параметр к разбору, поэтому ошибка молчала годами. Как только RemoteTech
// появился в GameData, ContractConfigurator впервые попытался разобрать antennaType —
// и 24 CONTRACT_TYPE упали с ArgumentException при загрузке (не крашат игру, просто не
// регистрируются как доступные контракты).
//
// Фикс: убираем строку antennaType — параметр HasAntenna остаётся («нужна хоть
// какая-то антенна»), просто без различия Dish/Omni. EITHER буквально и означало
// «любой тип годится», так что смысл не искажаем; RELAY у RemoteTech не тип антенны
// вообще (это стоковое CommNet-понятие), различить его через Dish/Omni всё равно
// нельзя было бы корректно.
//
// v26.27: изначальная версия фикса (v26.24) не сработала — исключения продолжали
// сыпаться на Главном меню, поймано живым мониторингом KSP.log. Причина оказалась
// ДВОЙНОЙ, обе найдены только прямым разбором исходных .cfg всех 24 контрактов
// (лог "Applying update" НЕ доказывает, что вложенный патч что-то реально нашёл —
// он лишь значит, что совпал внешний CONTRACT_TYPE-селектор):
//
// 1) `!antennaType = delete` — вероятно сработал бы, но проверить не удалось из-за (2).
// 2) ГЛАВНАЯ причина: PARAMETER{name=HasAntenna} НЕ прямой потомок CONTRACT_TYPE —
//    он вложен ещё на один уровень внутрь ОБЁРТКИ PARAMETER (обычно
//    type=VesselParameterGroup), и имя этой обёртки РАЗНОЕ в каждом файле:
//    Relay, Satellite, VesselParameterGroup, NewRelay — и у части файлов вообще
//    ДИНАМИЧЕСКОЕ ("Relay"+@idx, "Sat"+@idx) без статичного имени в принципе.
//    Прежний селектор `@PARAMETER[HasAntenna]` искал прямого потомка CONTRACT_TYPE
//    и ни разу не совпадал — патч был чистым no-op для всех 24 контрактов.
//
// v26.31: фикс v26.27 (`@PARAMETER[*]{ @PARAMETER[HasAntenna]{ !antennaType } }`)
// ТОЖЕ не сработал — те же 24 исключения на следующем живом запуске (подтверждено
// ModuleManager.ConfigCache). Причина: синтаксис «взять ВСЕ узлы» — `NODETYPE,*`
// (запятая-звезда), а НЕ `NODETYPE[*]` (последнее — nodeName="*", ветка «взять ОДИН
// узел», возвращает первого ребёнка, не обёртку с антенной).
//
// v26.32: фикс v26.31 (`@PARAMETER,*`) ТОЖЕ не сработал — четвёртая попытка, те же
// 24 исключения, снова подтверждено ConfigCache (`antennaType = EITHER` всё ещё в
// PARAMETER[Satellite] > PARAMETER[HasAntenna] у KPSPrototype). Прямой разбор кода
// (MMPatchLoader.cs) показывал, что `,*` ДОЛЖЕН включать ветку "взять все узлы" и
// применить вложенный патч к каждому — теоретически верно, но живой результат
// говорит об обратном (причина не установлена, возможно тонкость реализации,
// не покрытая чтением исходника без реального дебага рантайма).
//
// Вместо дальнейшего гадания с NODETYPE,*/[*] — сменил стратегию целиком. Прямым
// разбором ВСЕХ 24 исходных .cfg (скрипт, не выборочно) подтверждено: обёртка
// PARAMETER вокруг HasAntenna называется по-разному (Relay/Satellite/NewRelay/
// VesselParameterGroup/"Relay"+@idx), НО у ВСЕХ 24 без исключения имеет одно и то
// же поле `type = VesselParameterGroup`. Селектор `@PARAMETER:HAS[#type[...]]`
// (БЕЗ скобок-имени вообще, только :HAS[]-фильтр по полю type) не зависит от имени
// узла в принципе — тот же паттерн, что уже подтверждён рабочим дважды в этой же
// сессии: 332 живых применения в translations/RP-1/Localization/kerbalru-quests-patch.cfg
// (`@RDNode:HAS[#id[...]]`) и фикс AnomalySurveyor в этом же батче
// (`@REQUIREMENT:HAS[#hideChildren[true]]`).
//
// :FINAL, отсутствие узла (мод не стоит) = no-op.

@CONTRACT_TYPE[KsoRelay|KsoRelayAlt|KsoRelayFollowUp|LowTechRelay|LowTechRelay.0|MoonRelay|MoonRelayFollowUp|MoonRelayLagrange|OldKsoRelayReplace|OldRelayReplace|PlanetRelay|PlanetRelayFollowUp|PlanetRelayPolar|AddSatellites|KSOSatellite|KolyniaConstellation|LKOSatellite|MKOSatellite|PolarSatellite|KPSPrototype|KPSBlock.0|KPSBlock.1|KPSBlock.2|KPSStart]:NEEDS[RemoteTech,ContractConfigurator]:FINAL
{
	@PARAMETER[HasAntenna]
	{
		!antennaType
	}
	@PARAMETER:HAS[#type[VesselParameterGroup]]
	{
		@PARAMETER[HasAntenna]
		{
			!antennaType
		}
	}
}
