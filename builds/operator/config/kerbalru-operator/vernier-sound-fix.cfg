// kerbal.ru «Оператор» — фикс закольцованного звука у верньеров и стабилизаторов.
//
// Тот же класс дефекта, что knes-rcs-sound-fix.cfg и us2-wedge-sound-fix.cfg:
// слабая деталь крутит клип от настоящей ракеты (sound_rocket_mini) с loop = true.
//
// Правило, по которому отобраны детали (сверено по ModuleManager.ConfigCache
// всей сборки: 103 детали с зацикленным ракетным клипом, из них ≤ 5 кН — пять):
//   ЛЕЧИМ  — органы стабилизации и верньеры: они подрабатывают ПОСТОЯННО,
//            поэтому их гул висит весь полёт;
//   НЕ ТРОГАЕМ — маршевые двигатели малых аппаратов («Olaf» 4 кН,
//            «Dominique» 5 кН): там звук работы законен, он звучит по делу.
//
// Что остаётся: визуальный выхлоп и одноразовые звуки запуска/останова.
// :FINAL — поверх модов. Отсутствие детали или узла = no-op.

// KEREB-D «Reactionary» — стабилизатор с микродвигателем, 2 кН
@PART[_Knes_Diamant_Aileron_B]:FINAL
{
	@EFFECTS
	{
		@running
		{
			!AUDIO_MULTI_POOL {}
			!AUDIO {}
		}
	}
}

// CA-LV03 — верньерный двигатель Landver, 3,2 кН
@PART[ca_landv_vernier]:FINAL
{
	@EFFECTS
	{
		@running
		{
			!AUDIO_MULTI_POOL {}
			!AUDIO {}
		}
	}
}
