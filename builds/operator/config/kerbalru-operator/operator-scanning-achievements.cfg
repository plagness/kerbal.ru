// kerbal.ru «Оператор» — «тихие» ачивки-контракты за топографическую съёмку SCANsat.
//
// ПОЧЕМУ через ContractConfigurator, а не через мод Achievements: разбор исходника
// Achievements (linuxgurugamer, github.com/linuxgurugamer/Achievements) показал, что реально
// конфигурируемых через .cfg типов достижений у него только 3 (ORBITACHIEVEMENT/LANDING/
// SURFACESAMPLE — см. operator-custom-achievements.cfg) — сканирования там нет и быть не может,
// хуков не заложено. У ContractConfigurator, наоборот, есть НАТИВНЫЙ тип PARAMETER `SCANsatCoverage`
// прямо в ядре ContractConfigurator.dll — и он уже реально используется в живой сборке официальным
// паком самого SCANsat (GameData/SCANsat/Resources/Contracts/{Trivial,Significant,Exceptional}.cfg,
// пороги 75/85/95%). Синтаксис ниже — по образцу этих же файлов плюс минимального «тихого» контракта
// ExplorationPlus-FirstSteps.cfg (autoAccept/без наград/без дедлайна).
//
// Формула покрытия (SCANsat/SCANutil.cs, GetCoverage) капается на 99.9%, кроме идеального нуля
// несканированных ячеек — 100% на практике почти недостижимо из-за круглых зон обзора сенсоров
// на прямоугольной сетке карты. Порог 90% выбран сознательно (выше игрового «Exceptional»-порога
// 95% не берём — недостижимо для одиночного пролётного сканера без множественных повторных витков).
//
// «Тихий» = autoAccept (без ручного принятия) + нулевые награды/штрафы + maxCompletions=1 (не более
// одного раза) + deadline=0 (не проваливается по таймеру). Игра ВСЁ РАВНО покажет стоковое окно
// "Contract Complete!" при выполнении — это движковая логика, ни один параметр её не подавляет.
// Выполненный контракт остаётся в Mission Control во вкладке «Завершено» навсегда — это и есть
// персистентная «ачивка».
//
// Группировка тел — по реальному наблюдённому стилю игры (сейв "Sky Net": SCANsat активно
// используется у Кербина/Муны, сеть покрытия целится во внешнюю систему OPM):
//   - «Домашний кластер» (Кербин/Мун/Минмус) — полная съёмка: высотомер И биом, порог 90% каждый.
//   - «Внутренняя система» (Дюна/Ева/Мохо/Дрес) — только высотомер, порог 90%.
//   - «Внешняя система» (Sarnus/Urlum/Neidon/Plock, те же 4 тела, что и в operator-custom-
//     achievements.cfg) — только высотомер, порог 90% — продолжение темы «сеть покрытия».
//
// :NEEDS[SCANsat,ContractConfigurator] — no-op, если хотя бы один из двух модов не установлен.

// ── Домашний кластер: полная съёмка (высотомер + биом) ──────────────────────

CONTRACT_TYPE:NEEDS[SCANsat,ContractConfigurator]
{
	name = kerbalru_operator_scan_kerbin
	title = Полная карта Кербина
	group = kerbalruOperatorAchievements
	agent = Оператор
	synopsis = Отсканировать Кербин детальным высотомером и мультиспектральным сканером SCANsat не менее чем на 90% каждым
	completedMessage = Полная карта Кербина готова — высотный рельеф и биомы закартированы.
	minExpiry = 1
	maxExpiry = 1000
	deadline = 0
	maxCompletions = 1
	autoAccept = true
	cancellable = false
	declinable = false
	targetBody = Kerbin
	rewardScience = 0
	rewardReputation = 0
	rewardFunds = 0
	failureReputation = 0
	failureFunds = 0
	advanceFunds = 0

	PARAMETER { name = SCANsatCoverageAlt   type = SCANsatCoverage  targetBody = Kerbin  coverage = 90  scanType = AltimetryHiRes }
	PARAMETER { name = SCANsatCoverageBiome type = SCANsatCoverage  targetBody = Kerbin  coverage = 90  scanType = Biome }
}

