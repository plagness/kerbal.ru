// kerbal.ru «Оператор» — кастомные ачивки под механики сборки (мод Achievements, linuxgurugamer).
//
// ВАЖНО про формат: это НЕ ModuleManager-патч, а обычный ConfigNode, который Achievements
// подбирает сам через GameDatabase.Instance.GetConfigNodes("ACHIEVEMENTS") — метод агрегирует
// ВСЕ такие узлы из всего GameData, из любого количества файлов/папок. Поэтому :NEEDS[]/:FINAL
// тут неприменимы (это не MM-синтаксис) — файл просто ничего не делает, если сам мод Achievements
// не установлен (некому читать узел ACHIEVEMENTS).
//
// Проверено по исходнику мода (github.com/linuxgurugamer/Achievements, Source/Achievements/):
// РЕАЛЬНО настраиваемых через .cfg типов всего 3 — SURFACESAMPLE, ORBITACHIEVEMENT, LANDING
// (у каждого — своя фабрика, читающая ConfigNode в цикле). Остальные «типы» из списка классов
// (Docking, EVA, Flag, Funds, Reputation, Crash, Kill, Launch, Altitude, Jump, Tech,
// CountingAchievement, HyperEdit, TenSecondsFromLaunchPadToVAB, ContractsSet) — ЖЁСТКО зашиты
// в DLL фиксированным набором, конфигом не расширяются (ContractsSet, например, хардкодит ровно
// 3 ачивки на 1/20/100 контрактов и всё). Поэтому «ачивка за % сканирования планеты» или «ачивка
// за N ретрансляционных хопов RemoteTech» технически невозможна через этот мод — таких хуков в
// него не заложено. То, что ниже, — честный максимум того, что реально даёт архитектура мода,
// подобранный под тему сборки: сеть покрытия дальнего космоса + систематическое беспилотное
// освоение внешней системы (OPM).
//
// bodyRequirement = individual — ОДИН блок засчитывает достижение отдельно на каждое тело из
// bodies, текст поддерживает плейсхолдер BODY (сам мод подставляет имя тела при получении).
// bodyRequirement = requireAll — тот же список тел, но одно финальное достижение, когда закрыты
// ВСЕ тела сразу — capstone-ачивка «сеть/охват завершён».
//
// Имена тел сверены с ModuleManager.ConfigCache живой установки (OPM 2.x): Sarnus/Urlum/Neidon/
// Plock — большие тела за Джулом; Hale/Ovok/Slate/Tekto (спутники Sarnus), Priax/Tal/Polta/Wal
// (спутники Urlum), Thatmo (спутник Neidon), Karen (спутник Plock) — их 10 лун.

ACHIEVEMENTS
{
	ORBITACHIEVEMENT
	{
		key = kerbalru.operator.geostationary
		title = Кербосинхронный узел
		text = Вывести аппарат на почти круговую экваториальную орбиту синхронной высоты над Кербином — первый постоянный узел связи, висящий над одной точкой поверхности
		bodies = Kerbin
		minAltitude = 2830000
		maxAltitude = 2900000
		minInclination = 0
		maxInclination = 5
		minEccentricity = 0
		maxEccentricity = 0.05
	}

	ORBITACHIEVEMENT
	{
		key = kerbalru.operator.opm.orbit.individual
		title = Дальний рубеж
		text = Вывести аппарат на стабильную орбиту вокруг BODY — сеть покрытия дотянулась до внешней системы
		bodies = Sarnus Urlum Neidon Plock
		bodyRequirement = individual
		minAltitude = 0
		maxAltitude = -1
	}

	ORBITACHIEVEMENT
	{
		key = kerbalru.operator.opm.orbit.all
		title = Кольцо внешней системы
		text = Иметь аппарат на орбите вокруг каждой из четырёх больших планет за Джулом одновременно — сеть покрытия накрыла всю систему
		bodies = Sarnus Urlum Neidon Plock
		bodyRequirement = requireAll
		minAltitude = 0
		maxAltitude = -1
	}

	LANDING
	{
		key = kerbalru.operator.opm.landing.individual
		title = Нога на грунте
		text = Совершить посадку на BODY — ещё одна точка внешней системы нанесена на карту
		bodies = Sarnus Urlum Neidon Plock Hale Ovok Slate Tekto Priax Tal Polta Wal Thatmo Karen
		bodyRequirement = individual
	}

	LANDING
	{
		key = kerbalru.operator.opm.landing.all
		title = Полная топография
		text = Совершить посадку на всех больших телах и лунах внешней системы (Sarnus, Urlum, Neidon, Plock и их спутники) — флаг «Оператора» стоит на каждом
		bodies = Sarnus Urlum Neidon Plock Hale Ovok Slate Tekto Priax Tal Polta Wal Thatmo Karen
		bodyRequirement = requireAll
	}

	SURFACESAMPLE
	{
		key = kerbalru.operator.opm.samples.individual
		title = Грунт с окраины
		text = Взять пробу грунта на BODY и передать её на Кербин
		bodies = Sarnus Urlum Neidon Plock
		bodyRequirement = individual
	}

	SURFACESAMPLE
	{
		key = kerbalru.operator.opm.samples.all
		title = Полная геологическая съёмка
		text = Взять пробы грунта со всех четырёх больших планет за Джулом
		bodies = Sarnus Urlum Neidon Plock
		bodyRequirement = requireAll
	}
}
