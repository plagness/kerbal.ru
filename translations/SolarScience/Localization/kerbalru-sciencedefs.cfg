// SolarScience — Resources/ScienceDefs.cfg: title/RESULTS двух опытов (id=KMI, id=STEREO) заданы
// литералом, НЕ через #SOL-* ключи (в отличие от part.cfg/PAW-кнопок, см. ru.cfg). id уникальны
// для этого мода — точечная замена через % безопасна (не задевает чужие эксперименты).

@EXPERIMENT_DEFINITION:HAS[#id[KMI]]:FINAL
{
	%title = Доплеровские снимки KMI
	@RESULTS
	{
		%default = Здесь это вроде бы не должно работать, но поздравляем.
		%SunInSpaceHigh = Ты смотришь на удивительное светило, пока прибор выплёвывает кучу скучных серых снимков, совсем не похожих на Кербол. Отстой.
		%SunInSpaceLow = Эй, а что это там? Оно совсем рядом и очень яр- О БОЖЕ, ЭТО ЖЕ СОЛНЦЕ.
	}
}

@EXPERIMENT_DEFINITION:HAS[#id[STEREO]]:FINAL
{
	%title = Солнечные снимки STEREO
	@RESULTS
	{
		%default = Здесь это вроде бы не должно работать, но поздравляем.
		%SunInSpaceHigh = Приборы выплёвывают кучу снимков в суперкрутых цветах, но ни один из них не цвета Кербола. Центр управления уверяет, что фотоящик не сломан, в этот раз.
		%SunInSpaceLow = Слишком близко! ТАК БЛИЗКО! СЛИШКОМ БЛИЗКО!
	}
}
