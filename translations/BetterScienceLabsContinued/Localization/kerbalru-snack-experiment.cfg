// BetterScienceLabsContinued — эксперимент S.N.A.C.K. (Resources/ScienceDefs.cfg, id=bslSnack).
// Активируется только при :NEEDS[Snacks] (мод Snacks! не входит в текущую сборку, но перевод
// сделан для библиотеки — сработает у любого, кто поставит оба мода вместе).
// id уникален для BSL — полная замена RESULTS безопасна (!RESULTS{} + новый блок), как в
// translations/CoatlAerospace/Localization/kerbalru-science-ca-gamma.cfg.

@EXPERIMENT_DEFINITION:NEEDS[Snacks]:HAS[#id[bslSnack]]:FINAL
{
	%title = S.N.A.C.K. — научный перекус для кербалов
	!RESULTS {}
	RESULTS
	{
		default = Ага, мы едим снеки. Но на этот раз — во имя науки!
		default = Ммм... шоколад!
		default = Как есть пудинг, если не съел мясо?
		default = Замечаешь, что снеки здесь на вкус даже лучше.
		default = Уезжаю жить в деревню, буду есть персики вёдрами

		KerbinSrfLanded = Едим снеки... на Кербине... ну хоть на этот раз это ради науки!
		KerbinSrfLanded = Не верится, как повезло — получать науку просто за поедание снеков!
		KerbinInSpace = Похоже, надо переделать кружки под невесомость... УБЕРИ ЕЁ С ПРИБОРНОЙ ПАНЕЛИ!

		MunSrfLanded = Реголит совсем не на вкус как сахарная пудра!
		MunInSpace = Глядя на Муну отсюда, вспоминаешь... пончики в сахарной пудре.

		MinmusSrfLanded = Хм-м, лаймовый щербет обычно не сублимируется... ЭВАКУАЦИЯ! ЭВАКУАЦИЯ!
		MinmusInSpace = Какой вообще вкус у зелёной жвачки?

		EveSrfLanded = Не пойму, поднимаюсь я или падаю, счастлив я или в отчаянии — что бы это ни было, виноградное... околдовало меня.
		EveInSpace = Это атмосфера, или вся планета обёрнута сахарной ватой?

		GillySrfLanded = Низкая гравитация заставляет попкорн вылетать прямо из кастрюли.
		GillyInSpace = Ты видел размер этой картофелины?!

		MohoSrfLanded = ТРЕВОГА! ТРЕВОГА! Всё мороженое растаяло!
		MohoInSpace = Мохо рифмуется с какао. Это наводит на отличную мысль!

		SunInSpace = Смотри-ка! Можно приготовить хот-дог, просто поднеся его к иллюминатору!

		DunaSrfLanded = Улавливаю лёгкую нотку... корицы?
		DunaInSpace = Красное внутри, белое сверху... неужели это крупнейший в мире торт «Красный бархат»?

		JoolInSpace = Почему меня вдруг потянуло на огромный стакан лаймового лимонада?

		LaytheSrfLanded = Оказывается, сидеть на пляже и есть банановый сплит — одно из главных удовольствий жизни.
		LaytheInSpace = Глядя на Лейт из космоса, вспоминаешь, что давно не ел черничных панкейков.
	}
}

// PAW-кнопки эксперимента bslSnack одинаковы на всех 10 деталях (snackexperiment.cfg) — один
// патч по experimentID вместо повтора на каждую деталь.
@PART[*]:NEEDS[Snacks]:HAS[@MODULE[ModuleScienceExperiment]:HAS[#experimentID[bslSnack]]]:FINAL
{
	@MODULE[ModuleScienceExperiment]:HAS[#experimentID[bslSnack]]
	{
		%experimentActionName = Развернуть S.N.A.C.K.
		%resetActionName = Сбросить эксперимент S.N.A.C.K.
		%collectActionName = Собрать данные S.N.A.C.K.
	}
}
