		#LOC_KerbalAtomics_ntr-sc-375-1_title = NV-DC «Сцилла» — атомная аэроспайк-ракета
		#LOC_KerbalAtomics_ntr-sc-375-1_description = Двигатель для стартовых ступеней: тщательно спроектированный шестиреакторный ядерный двигатель — образец конструкции среднего класса. В штатном режиме при старте в камеру подаётся жидкий кислород, резко увеличивая тягу. Когда окислитель заканчивается, ракета уже не так зависит от тяги, и в дело вступает чисто водородная тяга. На орбите реактор в экономичном режиме выдаёт до 10 кВт электроэнергии. Сопло-аэроспайк эффективно работает на самых разных высотах. И да, отойдите от стартового стола подальше — очень подальше.
		#LOC_KerbalAtomics_ntr-sc-375-1_description_NFE = Двигатель для стартовых ступеней: тщательно спроектированный шестиреакторный ядерный двигатель — образец конструкции среднего класса. В штатном режиме при старте в камеру подаётся жидкий кислород, резко увеличивая тягу. Когда окислитель заканчивается, ракета уже не так зависит от тяги, и в дело вступает чисто водородная тяга. На орбите реактор в экономичном режиме выдаёт до 50 кВт электроэнергии. Сопло-аэроспайк эффективно работает на самых разных высотах. И да, отойдите от стартового стола подальше — очень подальше.
		#LOC_KerbalAtomics_ntr-sc-375-1_tags = атом ядерный эффективный двигатель жидкое топливо старт тяга реактор kerbalatomics бимодальный аэроспайк сцилла

		#LOC_KerbalAtomics_ntr-gc-25-1_title = NV-GE «Освободитель» — атомный ракетный двигатель
		#LOC_KerbalAtomics_ntr-gc-25-1_description = Нагревая активную зону до впечатляющих 6000 К (и превращая её в радиоактивный газ), «Освободитель» даёт атомам водородного топлива столько свободы, что они тут же покидают пределы реактора — отсюда исключительные тяга и удельный импульс. Реактор в этот момент «крайне энергичен», так что нужно проследить, чтобы сама активная зона никуда не улетела.
		#LOC_KerbalAtomics_ntr-gc-25-1_tags = атом ядерный эффективный двигатель орбита газовый реактор вакуум kerbalatomics освободитель
