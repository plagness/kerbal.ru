@PART[distometer100x]:FINAL
{
	@title = Beamer 100x — дальномер
	@description = Дальнобойный лазер! Ух ты! Наверное, что-то взрывает? Нет. Он просто измеряет расстояния — до земли или любого другого объекта, в который упирается луч, вдоль линии наведения. ВНИМАНИЕ: мощный дальнобойный лазер потребляет немало электричества. Range=100,000m^H^H^H^H^H^H^H^Hinfinite for now.
	@manufacturer = Смышлёные Сенсоры
}

@PART[distometer200x]:FINAL
{
	@title = Beamer 200x «SideBender» — дальномер
	@description = Модель 200x похожа на 100x, но умеет отклонять луч лазера из стороны в сторону — с помощью внутреннего зеркала, которым можно управлять прямо в полёте, для любых задач сканирования.
	@manufacturer = Смышлёные Сенсоры
}

@PART[distometer500x]:FINAL
{
	@title = Beamer 500x — прицельный дальномер
	@description = Делюкс-модель 500x похожа на 200x, но умеет отклонять луч лазера на несколько градусов сразу по ДВУМ осям, а не по одной — для полного контроля над наведением.
	@manufacturer = Смышлёные Сенсоры
}
