		#autoLOC_CustomAsteroids_ErrorGammaStd = Гамма-распределение должно иметь положительное стандартное отклонение (получено <<1>>).
		#autoLOC_CustomAsteroids_ErrorGammaShape = Гамма-распределение не может иметь отрицательный параметр формы (получено k = <<1>>).
		#autoLOC_CustomAsteroids_ErrorGammaScale = Гамма-распределение не может иметь отрицательный параметр масштаба (получено theta = <<1>>).
		#autoLOC_CustomAsteroids_ErrorBetaMean = Бета-распределение должно иметь среднее между минимумом и максимумом (получено <<1>> < <<2>> < <<3>>).
		#autoLOC_CustomAsteroids_ErrorBetaStd = Бета-распределение должно иметь положительное стандартное отклонение (получено <<1>>).
		#autoLOC_CustomAsteroids_ErrorBetaAlpha = Бета-распределение не может иметь отрицательный параметр формы (получено alpha = <<1>>).
		#autoLOC_CustomAsteroids_ErrorBetaBeta = Бета-распределение не может иметь отрицательный параметр формы (получено beta = <<1>>).
	}
}
