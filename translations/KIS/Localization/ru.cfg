// KIS — Kerbal Inventory System
// Русская локализация для сборки «Оператор» (kerbal.ru)
// Источник: GameData/KIS/Lang/en-us.cfg (Version: 8), 26 деталей.
// Метод: keyed — все PART-блоки KIS ссылаются на #KEY (title/manufacturer/description/tags
// заданы как "#KIS_xxx_Part_title" и т.п.), НЕ литералом. Мод уже несёт собственную ru.cfg
// (KIS/Lang/ru.cfg, автор IgorZ) — но библиотека kerbal.ru переводит поверх неё заново,
// своим стилем (единая терминология/длина по всей сборке), как уже сделано для сестринского
// мода KAS. Перевод не трогает исходный ru.cfg мода — просто патчит те же #KEY этим файлом,
// который деплоится в zzz-kerbalru-translations и применяется после мода.
// Деталей: 26. Ключей: 104 (title/manufacturer/description/tags × 26).
Localization
{
	ru
	{

		// ********** Part: KIS.basketball

		#KIS_basketball_Part_title = Баскетбольный мяч
		#KIS_basketball_Part_manufacturer = Kerbal Inventory Systems
		#KIS_basketball_Part_description = Отличный инструмент для изучения гравитации: даже в невесомости работает Третий закон Ньютона. Джеб утверждает, что нашёл этот мяч, когда его загадочно перенесло на планету Морон-Маунтин. ЦУП уверяет, что о такой миссии ничего не знает, но Джеб настаивает: его телепортировало через космос, когда прервалась связь. На вопрос о подробностях он всегда отказывается отвечать, говоря, что «обещал Майку сохранить тайну». Никто не знает, о чём он вообще говорит.
		#KIS_basketball_Part_tags = cck-eva-items

		// ********** Part: KIS.beer

		#KIS_beer_Part_title = Кербалтика 9
		#KIS_beer_Part_manufacturer = Kerbal Inventory Systems
		#KIS_beer_Part_description = Вкусное и доступное пиво. Каждому руководителю космического агентства стоит держать под рукой солидный запас — для крепкой мотивации экипажа и высокого боевого духа.
		#KIS_beer_Part_tags = cck-eva-items

		// ********** Part: KIS.bomb1

		#KIS_bomb1_Part_title = K4 стандартная взрывчатка
		#KIS_bomb1_Part_manufacturer = Kerbal Inventory Systems
		#KIS_bomb1_Part_description = Кто захочет взять бомбу на борт корабля? Только сумасшедший! Но наши обученные пилоты и инженеры умеют использовать этот заряд, чтобы избавиться от ненужных деталей или свести спутник с орбиты. Помните: до взрыва у вас есть лишь ограниченное время, чтобы отойти на безопасное расстояние! Ежемесячные тренировки гарантируют, что экипаж хорошо знает все правила безопасности.
		#KIS_bomb1_Part_tags = KIS EVA портативный инструмент разрушение бомба cck-eva-items

		// ********** Part: kis.concreteBase1

		#kis_concreteBase1_Part_title = CB1 наземная база
		#kis_concreteBase1_Part_manufacturer = Kerbal Inventory Systems
		#kis_concreteBase1_Part_description = Нужно закрепить что-то на поверхности небесного тела? Мы поможем. Встречайте бетонный блок! CB1 — наш вариант классической конструкции, которой инженеры доверяют веками: прочное основание крепится к грунту даже без инструментов. Крепить другие детали к блоку, конечно, придётся уже с инструментом — он продаётся отдельно.
		#kis_concreteBase1_Part_tags = KIS EVA портативный строительство постройка бетон cck-eva-items

		// ********** Part: KIS.Container1

		#KIS_Container1_Part_title = SC-62 переносной контейнер
		#KIS_Container1_Part_manufacturer = Kerbal Inventory Systems
		#KIS_Container1_Part_description = Внешний контейнер для инструментов, снеков и не только — разработан специально для миссии на Муну. За два дня до старта наземная команда обнаружила, что не осталось места для любимой кофейной кружки Валентины. Это ставило всю миссию под угрозу! К счастью, инженеры решили проблему, прикрепив снаружи обычный туристический рюкзак с алюминиевым каркасом. Экипажам конструкция понравилась настолько, что контейнеры-рюкзаки теперь производят серийно.
		#KIS_Container1_Part_tags = KIS контейнер инвентарь портативный cck-containers

		// ********** Part: KIS.Container2

		#KIS_Container2_Part_title = ILC-18k контейнер
		#KIS_Container2_Part_manufacturer = Kerbal Inventory Systems
		#KIS_Container2_Part_description = Иногда для миссии нужны вещи. И штуки. Много вещей и штук. Иногда девать вещи уже некуда, и нужно ещё что-то, куда их деть. Встречайте ILC-18k — контейнер побольше, куда можно запихнуть все ваши вещи.
		#KIS_Container2_Part_tags = KIS контейнер инвентарь cck-containers

		// ********** Part: KIS.Container3

		#KIS_Container3_Part_title = ISC-6K контейнер
		#KIS_Container3_Part_manufacturer = Kerbal Inventory Systems
		#KIS_Container3_Part_description = Переносной контейнер-рюкзак SC-62 стал большим успехом, но были и недостатки — например, к нему нельзя добраться изнутри корабля. Чтобы решить эту проблему, разработали полноценный контейнерный модуль. Из-за необходимости поддерживать постоянное давление внутри модуля его размер и цена выросли.
		#KIS_Container3_Part_tags = KIS контейнер инвентарь cck-containers

		// ********** Part: KIS.Container4

		#KIS_Container4_Part_title = ImC-1500 контейнер
		#KIS_Container4_Part_manufacturer = Kerbal Inventory Systems
		#KIS_Container4_Part_description = Три инженера на вечеринке хватают банки пива. Осушив пару штук, они решают, что это идеальная форма для нового компактного грузового модуля. Так родился Inline Mini-Container 1500 — для доставки деталей и снеков на дальние расстояния (холодильный отсек продаётся отдельно). Употреблять умеренно.
		#KIS_Container4_Part_tags = cck-containers KIS контейнер инвентарь

		// ********** Part: KIS.Container5

		#KIS_Container5_Part_title = IGC-25K контейнер
		#KIS_Container5_Part_manufacturer = Kerbal Inventory Systems
		#KIS_Container5_Part_description = Огромный контейнер (уж точно не снятый с грузового самолёта KEDEX), созданный для длительных миссий снабжения и межконтинентальных перевозок. Гарантия аннулируется, если переоборудовать его под будку телефона-автомата.
		#KIS_Container5_Part_tags = cck-containers KIS контейнер инвентарь

		// ********** Part: KIS.Container6

		#KIS_Container6_Part_title = IMiC-800 контейнер
		#KIS_Container6_Part_manufacturer = Kerbal Inventory Systems
		#KIS_Container6_Part_description = Самый маленький в линейке Inline: Inline Micro Container 800 — для случаев, когда нужно взять снеки или мелочи, но неохота надевать скафандр ради этого.
		#KIS_Container6_Part_tags = cck-containers KIS контейнер инвентарь

		// ********** Part: KIS.Container7

		#KIS_Container7_Part_title = IMC-15K контейнер
		#KIS_Container7_Part_manufacturer = Kerbal Inventory Systems
		#KIS_Container7_Part_description = Контейнер поменьше — появился, когда инженеры случайно разрезали IGC-25K пополам. Гарантия аннулируется при укладке с другим IMC-15K.
		#KIS_Container7_Part_tags = cck-containers KIS контейнер инвентарь

		// ********** Part: KIS.Container8

		#KIS_Container8_Part_title = IWC-3K «Wyvern»
		#KIS_Container8_Part_manufacturer = KIS
		#KIS_Container8_Part_description = Контейнер IWC-3K «Wyvern» — на случай, если не можете решить, хватит ли еды до Дюны, или лучше взять снеков про запас. Гарантия аннулируется при использовании с контейнерами не из линейки KIS (продаются отдельно).
		#KIS_Container8_Part_tags = cck-containers KIS контейнер инвентарь

		// ********** Part: KIS.ContainerMount1

		#KIS_ContainerMount1_Part_title = SM-62 крепление контейнера
		#KIS_ContainerMount1_Part_manufacturer = Kerbal Inventory Systems
		#KIS_ContainerMount1_Part_description = Простая система крепления для контейнера-рюкзака SC-62. Вернер фон Керман лично настраивает каждое крепление перед стартом — поэтому отказов не бывает, и все они благополучно долетают до орбиты. Гарантия аннулируется, если монтаж пришёлся на выходной Вернера.
		#KIS_ContainerMount1_Part_tags = KIS EVA постройка портативный контейнер cck-containers

		// ********** Part: KIS.electricScrewdriver

		#KIS_electricScrewdriver_Part_title = E-SD80 электроотвёртка
		#KIS_electricScrewdriver_Part_manufacturer = Kerbal Inventory Systems
		#KIS_electricScrewdriver_Part_description = Кое-кто остался не совсем доволен нашим прошлым продуктом — гаечным ключом. Джеб жаловался: «Это не то, что я хотел! Что дальше, отвёртка!?». Наши инженеры снова отнеслись к жалобе серьёзно. После года разработки и пяти неудачных прототипов (один даже устроил пожар на стартовом столе) представляем новинку: ЭЛЕКТРИЧЕСКУЮ отвёртку. Несмотря на название, шурупы пока не поддерживаются, зато подходят болты и гайки любого размера. Зато Джеб получил ровно то, что хотел!
		#KIS_electricScrewdriver_Part_tags = KIS EVA инструмент постройка портативный cck-eva-items

		// ********** Part: KIS.evapropellant

		#KIS_evapropellant_Part_title = EVA-11 канистра топлива
		#KIS_evapropellant_Part_manufacturer = Kerbal Inventory Systems
		#KIS_evapropellant_Part_description = Когда все скафандры оснастили маневровыми двигателями, ЦУП столкнулся с неожиданной проблемой: экипаж так пристрастился летать на ранцах, что топливо кончалось слишком быстро! После череды спасательных операций каждый корабль обязали брать запасной бак топлива на всякий случай. Теперь товарищи по экипажу могут спасать неосторожных коллег, пополняя их запас топлива. При необходимости бак можно дозаправить прямо от топлива корабля.
		#KIS_evapropellant_Part_tags = KIS EVA топливо портативный cck-eva-items

		// ********** Part: KIS.ghettoblaster

		#KIS_ghettoblaster_Part_title = Бумбокс
		#KIS_ghettoblaster_Part_manufacturer = Kerbal Inventory Systems
		#KIS_ghettoblaster_Part_description = Долгие перелёты бывают скучными, порой невыносимо. Чтобы скрасить жизнь наших отважных покорителей космоса, инженеры разработали особую версию кассетного магнитофона — магнитофон без кассеты! Он всегда играет одну и ту же мелодию, полностью исключая споры экипажа о музыкальных вкусах.
		#KIS_ghettoblaster_Part_tags = cck-eva-items

		// ********** Part: KIS.golfclub

		#KIS_golfclub_Part_title = Клюшка Альпарда Кермана
		#KIS_golfclub_Part_manufacturer = Kerbal Inventory Systems
		#KIS_golfclub_Part_description = Баллистические расчёты — это хорошо, но иногда куда приятнее просто стукнуть по предмету и посмотреть, как он полетит. Вот удобная длинная клюшка для этой цели. Обязательно записывайте научные наблюдения — например, сколько ударов нужно, чтобы загнать предмет в ударный кратер. А флажки, которые так любит расставлять Джеб, отлично подойдут для разметки кратеров!
		#KIS_golfclub_Part_tags = cck-eva-items

		// ********** Part: KIS.guide

		#KIS_guide_Part_title = KIS для чайников
		#KIS_guide_Part_manufacturer = Kerbal Inventory Systems
		#KIS_guide_Part_description = Мы как-то провели исследование и выяснили любопытный факт: никто не читает инструкцию перед полётом, сколько бы мы ни просили! Но стоит возникнуть проблеме в полёте, как все вдруг хотят её прочитать! В ответ на этот спрос наш административный отдел подготовил краткое руководство для использования прямо в миссии. Джеб по-прежнему считает его лишним — мол, он и так всё знает, а летает просто ради удовольствия.
		#KIS_guide_Part_tags = KIS инвентарь постройка книга портативный cck-eva-items

		// ********** Part: KIS.guitar

		#KIS_guitar_Part_title = Гитара Дэйви Кермана
		#KIS_guitar_Part_manufacturer = Kerbal Inventory Systems
		#KIS_guitar_Part_description = Иногда в открытом космосе не хватает только одного — гитары. Эта модель — North-Rope Strummin', третий по популярности бренд гитар на Кербине после Nos-Big и Red-Nef. Медиаторы продаются отдельно.
		#KIS_guitar_Part_tags = cck-eva-items

		// ********** Part: KIS.snacks

		#KIS_snacks_Part_title = Снеки!
		#KIS_snacks_Part_manufacturer = Kerbal Inventory Systems
		#KIS_snacks_Part_description = Употреблять умеренно. Гиперкалорийные добавки Snacks™ поднимут настроение экипажу даже в самых рутинных миссиях.
		#KIS_snacks_Part_tags = cck-eva-items

		// ********** Part: KIS.taco

		#KIS_taco_Part_title = Тако Т.Б. Кермана
		#KIS_taco_Part_manufacturer = Kerbal Inventory Systems
		#KIS_taco_Part_description = Говядина, овощи и острый соус в тортилье. Всё, что нужно кербонавту для обеда в невесомости. Что означает «Т.Б.», похоже, не знает никто.
		#KIS_taco_Part_tags = cck-eva-items

		// ********** Part: KIS.wrench

		#KIS_wrench_Part_title = BS-8 гаечный ключ
		#KIS_wrench_Part_manufacturer = Kerbal Inventory Systems
		#KIS_wrench_Part_description = Вернувшись из очередной обычной экспедиции, Джеб пожаловался: почти в каждом полёте какие-то детали расшатываются и летают по кабине. Инженеры отнеслись к жалобе серьёзно. После долгих исследований, множества экспериментов и галлонов кофе проблему диагностировали и нашли простое, но изящное решение: гаечный ключ! Теперь Джеб может закрепить разболтавшиеся детали или даже поставить лишние стойки прямо в полёте.
		#KIS_wrench_Part_tags = KIS EVA инструмент постройка портативный cck-eva-items

		// ********** Part: SEP.Box

		#SEP_Box_Part_title = Картонная коробка
		#SEP_Box_Part_manufacturer = Альберт Кермин Индастриз
		#SEP_Box_Part_description = Складная картонная коробка для переноски компонентов с посадочного модуля до места — для сборки станций SEP или чего угодно ещё.
		#SEP_Box_Part_tags = cck-containers cck-eva-items sep kis kas поверхность эксперимент инвентарь крепление eva хранение контейнер коробка картон

		// ********** Part: SEP.FallenKerbonaut

		#SEP_FallenKerbonaut_Part_title = Павший кербонавт
		#SEP_FallenKerbonaut_Part_manufacturer = Хойдонк ван Керман
		#SEP_FallenKerbonaut_Part_description = Эта небольшая алюминиевая скульптура — памятник всем кербонавтам и наземному персоналу, погибшим в освоении космоса. Автор попросил взять её с собой и оставить на поверхности Муны.
		#SEP_FallenKerbonaut_Part_tags = павший кербонавт скульптура искусство cck-eva-items

		// ********** Part: SEP.StorageLong

		#SEP_StorageLong_Part_title = AKI-L большой шкафчик
		#SEP_StorageLong_Part_manufacturer = Альберт Кермин Индастриз
		#SEP_StorageLong_Part_description = Шкафчик побольше — для хранения вещей на крупных кораблях. Никак не связан с пропажей шкафчиков инженеров из коридора.
		#SEP_StorageLong_Part_tags = cck-containers sep kis kas поверхность эксперимент инвентарь крепление eva хранение контейнер шкафчик

		// ********** Part: SEP.StorageShort

		#SEP_StorageShort_Part_title = AKI-S малый шкафчик
		#SEP_StorageShort_Part_manufacturer = Альберт Кермин Индастриз
		#SEP_StorageShort_Part_description = Заметив проблему с хранением деталей SEP на маленьких посадочных модулях, мы поручили инженерам найти решение. Они принесли этот стальной ящик — работает отлично. Нет, он никак не связан с недавней пропажей шкафчика Валентины.
		#SEP_StorageShort_Part_tags = cck-containers sep kis kas поверхность эксперимент инвентарь крепление eva хранение контейнер шкафчик
	}
}
