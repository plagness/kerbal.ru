    #LOC_RestockPlus_restock-pod-sphere-3_description = Мы наняли сомнительного дизайнера интерьеров, чтобы втиснуть три кресла в пространство для одного. Экипаж больше не может пошевелить руками, чтобы дотянуться до пульта, зато у них есть неплохие шансы выжить.
