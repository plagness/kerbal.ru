    #LOC_RestockPlus_restock-fuel-tank-5-1_description = Первую партию баков SIV изготовили после того, как ведущий инженер отправил на производство чертежи с неверно указанным масштабом. Результат оказался куда крупнее, чем ожидали в КЦК, — так родилась новая линейка сверхбольших ракет. Один из крупнейших баков «Кербодайн», настоящий монстр.
