    #LOC_RestockPlus_restock-drone-core-375-1_description = Исполинская система RGU-XL, спроектированная «Кербодайн» и построенная STEADLER, — триумф аэрокосмической инженерии с такими важными особенностями, как обширная пустота в центре, которую можно заполнить чем угодно. В отличие от других модулей, у него есть мощные маховики, так что он служит и гироскопом.
