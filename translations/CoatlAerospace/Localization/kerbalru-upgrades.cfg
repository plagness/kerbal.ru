// kerbal.ru — апгрейды деталей Coatl Aerospace (видны в R&D при разблокировке улучшений).
// Метод: MM-патч PARTUPGRADE по полю name. Бренд Coatl Aerospace — латиницей по политике.
// RB_Upgrade (телескоп ResearchBodies) переведён здесь же — приходит из compat-патча Coatl.

@PARTUPGRADE[ca-upgrade-thrust1]:FINAL
{
	@title = Coatl Aerospace: улучшение тяги 1
	@description = Исследования топлива и процессов горения позволили поднять тягу.
}

@PARTUPGRADE[ca-upgrade-thrust2]:FINAL
{
	@title = Coatl Aerospace: улучшение тяги 2
	@description = Доработки конструкции двигателей позволили поднять тягу.
}

@PARTUPGRADE[ca-upgrade-isp1]:FINAL
{
	@title = Coatl Aerospace: улучшение Iуд 1
	@description = Доработки конструкции двигателей позволили экономнее расходовать топливо.
}

@PARTUPGRADE[ca-upgrade-isp2]:FINAL
{
	@title = Coatl Aerospace: улучшение Iуд 2
	@description = Новая конструкция сопел дала прирост удельного импульса.
}

@PARTUPGRADE[ca-upgrade-optics1]:FINAL
{
	@title = Coatl Aerospace: улучшение оптики
	@description = Улучшенное стекло и новые технологии производства камер позволили поставить на часть приборов более качественную оптику.
}

@PARTUPGRADE[ca-upgrade-sensors1]:FINAL
{
	@title = Coatl Aerospace: улучшение датчиков
	@description = Более совершенная электроника для датчиков KerbNET.
}

@PARTUPGRADE[ca-upgrade-electrics1]:FINAL
{
	@title = Coatl Aerospace: улучшение солнечных элементов
	@description = Новые кристаллы элементов и транзисторы применены в ряде наших фотоэлектрических панелей для повышения их отдачи.
}

@PARTUPGRADE[ca-upgrade-avionics1]:FINAL
{
	@title = Coatl Aerospace: улучшение авионики
	@description = На несколько зондовых блоков установлены новейшие системы SAS.
}

@PARTUPGRADE[ca-upgrade-rw1]:FINAL
{
	@title = Coatl Aerospace: улучшение маховиков 1
	@description = Новые инженерные решения позволили улучшить наши системы гиродинов.
}

@PARTUPGRADE[ca-upgrade-rw2]:FINAL
{
	@title = Coatl Aerospace: улучшение маховиков 2
	@description = В системы гиродинов установлены более мощные и надёжные моторы.
}

@PARTUPGRADE[RB_Upgrade]:FINAL
{
	@title = Улучшение телескопа-открывателя
	@description = Увеличивает дальность телескопа до 900 Гм — примерно в 22,5 раза больше исходной и почти вдвое дальше, чем расстояние до Плока.
}
