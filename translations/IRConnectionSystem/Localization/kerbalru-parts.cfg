// IRConnectionSystem (аддон InfernalRoboticsNext — захваты/крепления) — русификация деталей
// Метод mm-title: title/description/manufacturer/tags литералом в part.cfg → патчим ModuleManager
// прямым оператором @ (:FINAL) поверх исходных значений. Матчинг по полю name узла PART.
// Деталей: 2. Manufacturer «Magic Smoke Industries» — бренд, оставлен латиницей (см. прецедент
// translations/HullCameraVDS и translations/MagicSmokeIndustries).

@PART[IR_MagneticGrabber]:FINAL
{
	@title = Ютилитрон — Захват
	@description = Эта деталь цепляется к другим деталям и аппаратам с помощью магнита — отлично подходит для рук захвата капсул на станциях. Также включает подсветку для ночных операций.
	@manufacturer = Magic Smoke Industries
	@tags = робот магнит соединение крепление захват подсветка
}

@PART[IR_MechanicalGrasper]:FINAL
{
	@title = Ютилитрон — Якорь
	@description = Эта деталь позволяет закрепить роботизированную конструкцию на других деталях, аппаратах и поверхностях с помощью механических микрошипов — отлично подходит для скалолазающих роботов!
	@manufacturer = Magic Smoke Industries
	@tags = робот клешня соединение крепление захват
}
