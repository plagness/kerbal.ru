// kerbal.ru — описание агентства Kerbal Standard (AirplanePlus).
// title = бренд, латиницей по политике; переводим только description.
// Пробел в имени узла → '?' в селекторе MM.

@AGENT[Kerbal?Standard]:FINAL
{
	@description = Kerbal Standard — постоянно растущий конгломерат. Многие его изделия названы по инициалам дочерних компаний: RR, DB, WMB. У продукции самой головной компании особых имён нет. Kerbal Standard известна сделками с Winter Owl и C7 Aerospace: она выкупила часть прав на конструкции деталей, чтобы работать вместе с ними. Большинство разработок конгломерата создаётся с прицелом на добротный дизайн и хорошую коммерческую отдачу.
}
