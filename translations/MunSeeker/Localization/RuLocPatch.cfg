// MunSeeker (ZZZ Radio Telescope) — редирект литеральных полей на #LOC-ключи.
// `%` = установить-или-создать, `@PART[]`/`@MODULE[]`/`@CONTRACT_GROUP[]`/
// `@CONTRACT_TYPE[]` матчат по полю `name` — обычные, многократно проверенные
// в этом репозитории узлы (в отличие от RDNode, см. MAINTAINING.md).
// `:FINAL` — применяется последним, после любых retrofit-патчей других модов.

@PART[radiotelescope]:FINAL
{
	%title = #LOC_MunSeeker_radiotelescope_title
	%description = #LOC_MunSeeker_radiotelescope_description
	%manufacturer = #LOC_MunSeeker_radiotelescope_manufacturer
	%tags = #LOC_MunSeeker_radiotelescope_tags

	@MODULE[ModuleScienceExperiment]
	{
		%experimentActionName = #LOC_MunSeeker_radiotelescope_expAction
		%resetActionName = #LOC_MunSeeker_radiotelescope_resetAction
		%collectActionName = #LOC_MunSeeker_radiotelescope_collectAction
	}

	@MODULE[ModuleAnimateGeneric]
	{
		%startEventGUIName = #LOC_MunSeeker_radiotelescope_startEvent
		%endEventGUIName = #LOC_MunSeeker_radiotelescope_endEvent
	}
}

@CONTRACT_GROUP[KerbinOrbitalTelescope]:FINAL
{
	%displayName = #LOC_MunSeeker_cg_KerbinOrbitalTelescope_displayName
}

@CONTRACT_GROUP[MunOrbitalTelescope]:FINAL
{
	%displayName = #LOC_MunSeeker_cg_MunOrbitalTelescope_displayName
}

@CONTRACT_TYPE[KerbinOrbitalTelescopeDeployment]:FINAL
{
	%title = #LOC_MunSeeker_ct_KerbinDeploy_title
	%description = #LOC_MunSeeker_ct_KerbinDeploy_description
	%synopsis = #LOC_MunSeeker_ct_KerbinDeploy_synopsis
	%completedMessage = #LOC_MunSeeker_ct_KerbinDeploy_completedMessage
}

@CONTRACT_TYPE[MunOrbitalTelescopeDeployment]:FINAL
{
	%title = #LOC_MunSeeker_ct_MunDeploy_title
	%description = #LOC_MunSeeker_ct_MunDeploy_description
	%synopsis = #LOC_MunSeeker_ct_MunDeploy_synopsis
	%completedMessage = #LOC_MunSeeker_ct_MunDeploy_completedMessage
}
