// MunSeeker (ZZZ Radio Telescope) — русская локализация.
// Мод не имеет своей системы локализации (тип PATCH): title/description и
// module-поля зашиты литералом прямо в part.cfg/Contracts.cfg. Редиректим их
// через ModuleManager на #LOC-ключи (RuLocPatch.cfg), en-us ниже дословно
// повторяет оригинал — для англоязычных игроков ничего не меняется.
//
// Проверено и НЕ переведено (см. отчёт агента):
// - Вложенные PARAMETER/REQUIREMENT в Contracts.cfg (тексты требований вида
//   "Have one of the following power generators", "1 or more solar panels" и
//   т.п.) — реальный текст, но узлы без уникального `name` на этой глубине
//   (несколько соседних PARAMETER с одинаковым name = "PartValidation" на
//   разных уровнях вложенности); безопасного прецедента адресации такой
//   вложенности в репозитории нет (см. MAINTAINING.md о ловушке RDNode) —
//   не гадаем, оставлено на английском.
// - agent = "Space Penguins, Inc" — вымышленное имя агентства-заказчика,
//   собственное имя, не переводится.

Localization
{
	en-us
	{
		#LOC_MunSeeker_radiotelescope_title = Triple-Z Radio Astronomy Telescope
		#LOC_MunSeeker_radiotelescope_description = A new type of large radio telescope that can be packed into a small volume and deployed at remote locations. Contains a small SAS for stability control.  The receiver needs 5 units electrical charge per second. Provides science reports.
		#LOC_MunSeeker_radiotelescope_manufacturer = ZZZ Industries, Wild Blue Industries, MunSeeker Artisanal Devices
		#LOC_MunSeeker_radiotelescope_tags = camera telescope detect satellite scan radio
		#LOC_MunSeeker_radiotelescope_expAction = Log Astronomy Data
		#LOC_MunSeeker_radiotelescope_resetAction = Delete Data
		#LOC_MunSeeker_radiotelescope_collectAction = Take Data
		#LOC_MunSeeker_radiotelescope_startEvent = Deploy
		#LOC_MunSeeker_radiotelescope_endEvent = Retract

		#LOC_MunSeeker_cg_KerbinOrbitalTelescope_displayName = Kerbin Orbital Telescope
		#LOC_MunSeeker_cg_MunOrbitalTelescope_displayName = Mun Orbital Telescope

		#LOC_MunSeeker_ct_KerbinDeploy_title = Launch a Radio Telescope Observatory to Kerbin Orbit
		#LOC_MunSeeker_ct_KerbinDeploy_description = Our scientists are eager to explore the universe with an orbital radio telescope and research facility in orbit around Kerbin.
		#LOC_MunSeeker_ct_KerbinDeploy_synopsis = Launch a radio telescope to Kerbin orbit
		#LOC_MunSeeker_ct_KerbinDeploy_completedMessage = Telescope Complete!

		#LOC_MunSeeker_ct_MunDeploy_title = Launch a Radio Telescope Observatory to Mun Orbit
		#LOC_MunSeeker_ct_MunDeploy_description = Our scientists are very happy with the Kerbin orbital radio telescope. A second telescope in Mun Orbit will allow them to see even further into deep space.
		#LOC_MunSeeker_ct_MunDeploy_synopsis = Launch a radio telescope to Mun orbit!
		#LOC_MunSeeker_ct_MunDeploy_completedMessage = Telescope Complete!
	}

	ru
	{
		#LOC_MunSeeker_radiotelescope_title = Радиоастрономический телескоп Triple-Z
		#LOC_MunSeeker_radiotelescope_description = Новый тип крупного радиотелескопа, который складывается в небольшой объём и разворачивается в удалённых точках. Оснащён небольшой SAS для стабилизации. Приёмнику нужно 5 ед. электрозаряда в секунду. Даёт научные отчёты.
		#LOC_MunSeeker_radiotelescope_manufacturer = ZZZ Industries, Wild Blue Industries, MunSeeker Artisanal Devices
		#LOC_MunSeeker_radiotelescope_tags = камера телескоп обнаруж спутник скан радио
		#LOC_MunSeeker_radiotelescope_expAction = Записать данные наблюдений
		#LOC_MunSeeker_radiotelescope_resetAction = Удалить данные
		#LOC_MunSeeker_radiotelescope_collectAction = Забрать данные
		#LOC_MunSeeker_radiotelescope_startEvent = Развернуть
		#LOC_MunSeeker_radiotelescope_endEvent = Сложить

		#LOC_MunSeeker_cg_KerbinOrbitalTelescope_displayName = Орбитальный телескоп Кербина
		#LOC_MunSeeker_cg_MunOrbitalTelescope_displayName = Орбитальный телескоп Муны

		#LOC_MunSeeker_ct_KerbinDeploy_title = Запустить радиотелескоп-обсерваторию на орбиту Кербина
		#LOC_MunSeeker_ct_KerbinDeploy_description = Наши учёные горят желанием исследовать вселенную с помощью орбитального радиотелескопа и научной станции на орбите Кербина.
		#LOC_MunSeeker_ct_KerbinDeploy_synopsis = Запустите радиотелескоп на орбиту Кербина
		#LOC_MunSeeker_ct_KerbinDeploy_completedMessage = Телескоп готов!

		#LOC_MunSeeker_ct_MunDeploy_title = Запустить радиотелескоп-обсерваторию на орбиту Муны
		#LOC_MunSeeker_ct_MunDeploy_description = Наши учёные очень довольны орбитальным радиотелескопом у Кербина. Второй телескоп на орбите Муны позволит заглянуть ещё дальше в космос.
		#LOC_MunSeeker_ct_MunDeploy_synopsis = Запустите радиотелескоп на орбиту Муны
		#LOC_MunSeeker_ct_MunDeploy_completedMessage = Телескоп готов!
	}
}
