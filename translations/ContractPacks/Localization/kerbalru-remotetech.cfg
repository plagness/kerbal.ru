{
	@title = Спутник связи для каждой планеты
	@description = У нас созрел гениальный план. Давайте запустим спутник с тарелкой на каждую планету системы! Тогда больше не придётся возиться с постоянными запусками. Неплохо бы ещё вывести его на @geostationary орбиту над КЦ. И на всякий случай сразу запустите второй — вдруг первый сломается.
	@synopsis = Запустите два спутника, способных достать до каждой планеты системы.
	@completedMessage = Спутники развёрнуты, сигнал идёт, наладочные испытания завершены!
