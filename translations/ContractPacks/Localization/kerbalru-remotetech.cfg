	@description = Хотим узнать, что там, снаружи, — для начала запустим спутник-другой с новой тарелкой побольше.
	@synopsis = Запустите спутник с достаточной дальностью для внутренних планет и наведите его на одну из них. Убедитесь в связи с ЦУП.
	@completedMessage = Спутник развёрнут, сигнал идёт, наладочные испытания завершены!
