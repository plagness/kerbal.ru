// kerbal.ru — русификация контракт-пака ContractPacks-RemoteTech (Contract Configurator)
// Безопасные MM-патчи по имени узла. Только верхнеуровневые текстовые поля
// title/description/synopsis/completedMessage у CONTRACT_TYPE + @description у AGENT.
// ВАЖНО: каждое CC-выражение (@targetBody, @/x, @x.Method() и т.п.) окружено
// ASCII-пробелами, сразу после него всегда идёт русское слово — никакой
// пунктуации/цифры вплотную (иначе Contract Configurator не распознает выражение).
//
// СПЕЦИАЛЬНЫЙ СЛУЧАЙ (5 контрактов): description — это CC-выражение вида
// "@isX ? @descX : @descDefault", ссылающееся на строковые литералы в соседнем
// безымянном узле DATA. Такие выражения НЕ трогаем вообще. Вместо этого нацеливаемся
// на сам DATA-узел по 0-based индексу среди узлов с тем же именем ("DATA,N") —
// это штатный синтаксис ModuleManager для безымянных узлов — и переводим внутри
// только сами строковые литералы (descDefault/descX/synopsisX и т.п.), не трогая
// служебные ключи вроде parentKey/moonKey/combinedKey. DATA_EXPAND — другой тип
// узла и в индекс "DATA,N" не входит.
// ГРАБЛЯ НА БУДУЩЕЕ: индекс завязан на порядок узлов в оригинальном .cfg этой
// версии пака; при обновлении RemoteTech-контрактов порядок DATA-узлов надо
// перепроверить (см. исходники в GameData/ContractPacks/RemoteTech/*.cfg).

// ============================ АГЕНТСТВО ============================

@AGENT[Communication?Satellite?Group]:FINAL
{
	@description = Communication Satellite Group берётся за любые задачи связи (если это подразумевает спутник в космосе, который говорит с другими штуками в космосе).
}

// ============================ Kerbin ============================

@CONTRACT_TYPE[RT_KerbinRelay]:FINAL
{
	@title = Постройте сеть для @targetBody (3 спутника)
	@description = ЦУП устал терять корабли и зонды за горизонтом — от них давно ни слуху ни духу. Нужно наладить постоянную связь, если мы хотим по-настоящему исследовать @targetBody.Children().First() и не только.
	@synopsis = Постройте сеть связи из трёх спутников с постоянной связью с ЦУП.\n\nТакже берите только одну версию контракта — на три или четыре спутника (выполнить обе невозможно).
	@completedMessage = Сеть развёрнута, сигнал идёт, наладочные испытания завершены!
}

@CONTRACT_TYPE[RT_KerbinRelay_4sat]:FINAL
{
	@title = Постройте сеть для @targetBody (4 спутника)
	@description = ЦУП устал терять корабли и зонды за горизонтом — от них давно ни слуху ни духу. Нужно наладить постоянную связь, если мы хотим по-настоящему исследовать @targetBody.Children().First() и не только.
	@synopsis = Постройте сеть связи из четырёх спутников с постоянной связью с ЦУП.\n\nТакже берите только одну версию контракта — на три или четыре спутника (выполнить обе невозможно).
	@completedMessage = Сеть развёрнута, сигнал идёт, наладочные испытания завершены!
}

// ============================ Moons ============================

@CONTRACT_TYPE[RT_MoonDish]:FINAL
{
	@title = Наведите тарелку от @targetBody
	// description/synopsis — CC-выражения по moonCount, переводим литералы во втором DATA-узле.
	@DATA,1
	{
		@descOne = Наведите тарелку на @firstMoon и начните отправлять туда зонды!
		@descMany = Наведите тарелку на один из спутников @targetBody и начните отправлять зонды!
		@synopsisOne = Наведите тарелку на @firstMoon!
		@synopsisMany = Наведите тарелку на один из наших спутников!
	}
	@completedMessage = Сигнал вернулся эхом, отличная работа!
}

@CONTRACT_TYPE[RT_MoonRelay]:FINAL
{
	@title = Постройте сеть для @targetBody
	// description — CC-выражение по isMinmus, переводим литералы во втором DATA-узле.
	@DATA,1
	{
		@descDefault = ЦУП хочет узнать, что там, на обратной стороне @targetBody и просит для этого сеть ретрансляторов.
		@descMinmus = Говорят, Минмус слишком мал, чтобы заморачиваться отдельной сетью связи. Докажем, что они неправы!
	}
	@synopsis = Постройте сеть связи с покрытием @targetBody и выходом на ЦУП.
	@completedMessage = Сеть развёрнута, сигнал идёт, наладочные испытания завершены!
}

