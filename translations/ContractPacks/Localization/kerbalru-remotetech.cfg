	@DATA,1
	{
		@descDefault = Хотелось бы побольше узнать о @targetBody и снарядить туда сеть связи.
		@descMoho = Хотим проверить, выдержат ли наши зонды температуру на @targetBody и наладить там сеть связи.
		@descDuna = Хотим узнать, поедут ли колёса наших роверов по @targetBody и заодно наладить там сеть связи.
		@descEve = Хотим проверить, хватит ли мощности наших антенн, чтобы пробиться через лиловые тучи Евы — наладьте для этого сеть связи.
		@descVenus = Хотим проверить, хватит ли мощности наших антенн, чтобы достать до поверхности Венеры — наладьте для этого сеть связи.
