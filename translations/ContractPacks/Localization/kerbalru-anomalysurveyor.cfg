// AnomalySurveyor (nightingale, Contract Configurator) — русификация верхнеуровневых текстовых
// полей (genericTitle/title/description/genericDescription/synopsis/completedMessage/notes) +
// содержательных PARAMETER/REQUIREMENT title. Метод mm-contract: @CONTRACT_TYPE[Name]:FINAL,
// вложенные @PARAMETER[Name]{@title=...} / @REQUIREMENT[Name]{@title=...} — там же.
// Апоцентр/перицентр не встречаются (контракты только на облёт/посадку/EVA, не орбитальные манёвры).
// BEHAVIOUR/DIALOG_BOX/WAYPOINT-маркеры не трогаем — вне заявленного охвата (только контрактный
// текст, не внутриигровые метки и диалоги, см. прецедент kerbalru-kerbinstation.cfg).
// Часть REQUIREMENT-узлов в исходнике не имеет поля name (только type/title) — такие матчатся
// через @REQUIREMENT:HAS[#field[значение]] (БЕЗ скобок-имени!) по уникальному соседнему полю
// (hideChildren/count/title), а не по имени. ⚠️ [*] ВНУТРИ скобок — это НЕ "любой узел", а
// попытка найти узел с именем "*" (и такой узел без name-поля вообще не находится — see
// v26.31/contractconfigurator-rt-antennatype-fix.cfg). Раньше здесь стояло @REQUIREMENT[*]:HAS[...]
// — молча не работало для всех безымянных REQUIREMENT, исправлено на голое @REQUIREMENT:HAS[...].
// @targetBody / @anomalyName — CC-выражения без слэша (ссылка на поле того же узла), окружены
// ASCII-пробелами; там, где в оригинале токен стоял вплотную к точке, перед точкой добавлен пробел
// (защита CC-парсера, как в kerbalru-unmannedcontracts.cfg).
// "TMA" (Tycho Magnetic Anomaly, отсылка к «Космической одиссее 2001») — не переводим, устоявшееся
// обозначение самих монолитов-аномалий, используется как есть во всех связанных контрактах.
// Cydunia → «Кидуния» — каламбур Cydonia+Duna, переведён каламбуром по аналогии (см. Kolniya/Tundra
// в kerbalru-unmannedcontracts.cfg).

// ===== CONTRACT_GROUP =====
@CONTRACT_GROUP[AnomalySurveyor]:FINAL
{
	@displayName = Разведка аномалий
	@tip = Разведываем аномалии…
}

// ===== AGENT =====
@AGENT[Anomaly?Surveyor?Group]:FINAL
{
	@description = Anomaly Surveyor Group набирает отважных исследователей — обследовать таинственные аномалии по всей звёздной системе!
}

