// ZZZRadioTelescope (MunSeeker, Contract Configurator) — русификация верхнеуровневых текстовых
// полей + содержательных PARAMETER-title. Метод mm-contract: @CONTRACT_TYPE[Name]:FINAL для
// title/description/synopsis/completedMessage, вложенные @PARAMETER[Name]{@title=...} — там же.
// Апоцентр/перицентр не встречаются (контракты только на выход на орбиту). LKO не переводим —
// латинская аббревиатура по общей политике пака (см. комментарий в kerbalru-constellations.cfg).
// Triple-Z — собственное название телескопа мода, не переводим.

// ===== CONTRACT_GROUP =====
@CONTRACT_GROUP[KerbinOrbitalTelescope]:FINAL
{
	@displayName = Орбитальный телескоп Кербина
}

@CONTRACT_GROUP[MunOrbitalTelescope]:FINAL
{
	@displayName = Орбитальный телескоп Муны
}

// ===== KerbinOrbitalTelescopeDeployment =====
@CONTRACT_TYPE[KerbinOrbitalTelescopeDeployment]:FINAL
{
	@title = Выведите радиотелескопическую обсерваторию на орбиту Кербина
	@description = Наши учёные жаждут исследовать вселенную с помощью орбитального радиотелескопа и исследовательской станции на орбите Кербина.
	@synopsis = Выведите радиотелескоп на орбиту Кербина
	@completedMessage = Телескоп готов!

	@PARAMETER[NewTelescope]
	{
		@title = Выведите новый радиоастрономический телескоп Triple-Z на LKO
		@notes = Станция должна включать телескоп Triple-Z, 1 стыковочный узел, научную лабораторию и источник энергии. Это можно сделать за один запуск или несколько.
		@PARAMETER[RTGSolar]
		{
			@title = Обзаведитесь одним из следующих источников энергии
			@PARAMETER[PartValidationRTG]{@title = 1 и более солнечных панелей}
			@PARAMETER[PartValidationSolar]{@title = 1 и более генераторов}
			@PARAMETER[PartValidationNearFutureSolar]{@title = 1 и более изогнутых солнечных панелей}
			@PARAMETER[PartValidationNearFutureReactors]{@title = 1 и более реакторов деления}
			@PARAMETER[PartValidationNearFutureRTGs]{@title = 1 и более радиоизотопных генераторов}
		}
		@PARAMETER[ScienceLab]{@title = Имейте научную лабораторию на борту}
		@PARAMETER[StationScienceSupport]
		{
			@title = Имейте любую научную лабораторию на борту
			@PARAMETER[PartValidation,0]{@title = 1 и более стандартных научных лабораторий}
			@PARAMETER[PartValidation,1]
			{
				@title,0 = 1 и более исследовательских станций
				@title,1 = Научная станционная лаборатория
			}
		}
	}
}

// ===== MunOrbitalTelescopeDeployment =====
@CONTRACT_TYPE[MunOrbitalTelescopeDeployment]:FINAL
{
	@title = Выведите радиотелескопическую обсерваторию на орбиту Муны
	@description = Наши учёные очень довольны орбитальным радиотелескопом Кербина. Второй телескоп на орбите Муны позволит заглянуть ещё дальше в глубокий космос.
	@synopsis = Выведите радиотелескоп на орбиту Муны!
	@completedMessage = Телескоп готов!

	@PARAMETER[NewTelescope]
	{
		@title = Выведите новый радиоастрономический телескоп Triple-Z на орбиту Муны
		@notes = Станция должна включать телескоп Triple-Z, 1 стыковочный узел, научную лабораторию и источник энергии. Это можно сделать за один запуск или несколько.
		@PARAMETER[RTGSolar]
		{
			@title = Обзаведитесь одним из следующих источников энергии
			@PARAMETER[PartValidationRTG]{@title = 1 и более солнечных панелей}
			@PARAMETER[PartValidationSolar]{@title = 1 и более генераторов}
			@PARAMETER[PartValidationNearFutureSolar]{@title = 1 и более изогнутых солнечных панелей}
			@PARAMETER[PartValidationNearFutureReactors]{@title = 1 и более реакторов деления}
			@PARAMETER[PartValidationNearFutureRTGs]{@title = 1 и более радиоизотопных генераторов}
		}
		@PARAMETER[ScienceLab]{@title = Имейте научную лабораторию на борту}
		@PARAMETER[StationScienceSupport]
		{
			@title = Имейте любую научную лабораторию на борту
			@PARAMETER[PartValidation,0]{@title = 1 и более стандартных научных лабораторий}
			@PARAMETER[PartValidation,1]
			{
				@title,0 = 1 и более исследовательских станций
				@title,1 = Научная станционная лаборатория
			}
		}
	}
}
