@CONTRACT_TYPE[BaseCreate]:FINAL
{
	@title = Основание базы на @/targetBody1
	@genericTitle = Постройте базу на другом мире
	@description = Наши инженеры думали, как разместить кербалов на @/targetBody1 и позволить им остаться там надолго. Вот тут-то вы и нужны.
	@genericDescription = Наши инженеры думали, как разместить кербалов на других мирах и позволить им остаться там надолго.
	@notes = Разместите новую базу на поверхности @targetBody1 рядом с ровером.
	@synopsis = Мы хотим, чтобы вы начали строительство базы на @/targetBody1
	@completedMessage = Вы завершили первый этап базы на @/targetBody1
	@PARAMETER[All]
	{
		@PARAMETER[HabModule]{@title = Обеспечьте вместимость для 4 кербалов}
		@PARAMETER[Any]
		{
			@title = Обзаведитесь одним из следующих источников энергии
			@PARAMETER[Solar]{@title = 1 и более солнечных панелей}
			@PARAMETER[Generator]{@title = 1 и более РИТЭГов}
