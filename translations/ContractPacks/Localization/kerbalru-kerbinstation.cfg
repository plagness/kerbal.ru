	@REQUIREMENT[RandomRoll]{@title = Удача должна быть на вашей стороне.}
}

@CONTRACT_TYPE[ExtraCrewCapacity]:FINAL
{
	@title = Увеличьте вместимость экипажа @/targetVessel1
	@genericTitle = Увеличение вместимости экипажа
	@description = У нас проблема. Кербонавт @/targetKerbal1 жалуется: всё, что он чувствует, — это запах пота, которым благоухает @/targetKerbal2 рядом. Сделаем ему одолжение и добавим на @/targetVessel1 немного свободного места.
	@genericDescription = На космических станциях бывает тесновато. Добавьте немного места для экипажа.
	@synopsis = Модернизируйте @/targetVessel1 так, чтобы он вмещал @/Counter кербалов.
	@completedMessage = Отличная работа! Кербонавт @/targetKerbal1 благодарит вас. И его нос — тоже!
	@PARAMETER[HasCrewCapacity]{@title = Запустите новый жилой модуль. Он должен вмещать не менее 4 кербалов}
	@PARAMETER[Docking]{@title = Состыкуйтесь с @/targetVessel1}
	@PARAMETER[All]{@title = Выведите @/targetKerbal1 подышать свежим воздухом. (опционально)}
}

@CONTRACT_TYPE[ScienceExperimentModule]:FINAL
{
	@title = Проведите @/experimentToPerform в состыковке с @/targetVessel1
	@genericTitle = Проведите научные эксперименты на космической станции
	@description = Вернер фон Керман придумал, как выжать из @/experimentToPerform куда больше науки. К сожалению, доработка детали влетит нам в копеечку, да и энергии на неё потребуется гораздо больше.
	@genericDescription = Вернер фон Керман придумал, как выжать куда больше науки из уже проведённого эксперимента. К сожалению, доработка детали влетит нам в копеечку, да и энергии на неё потребуется гораздо больше.
	@synopsis = Проведите @/experimentToPerform в состыковке с @/targetVessel1 и затем верните эксперимент на Kerbin.
	@completedMessage = Теперь мы стали лучше понимать то, о чём не имеем ни малейшего понятия!
	@PARAMETER[Sequence]
	{
		@PARAMETER[Docking]{@title = Состыкуйтесь с @/targetVessel1}
		@PARAMETER[CollectScience]{@title = Проведите @/experimentToPerform на @/targetVessel1 и верните его на Kerbin}
	}
	@REQUIREMENT[StationCheck]{@title = Станция должна быть на орбите}
	@REQUIREMENT[RandomRoll]{@title = Удача должна быть на вашей стороне.}
}

@CONTRACT_TYPE[CrewRotation]:FINAL
