@CONTRACT_TYPE[SurfaceSample]:FINAL
{
	@title = Доставьте образец грунта из @/biome1 на @/targetVessel1
	@genericTitle = Доставьте образец грунта на космическую станцию
	@description = Наш исследовательский отдел хочет узнать, как космос влияет на что-нибудь, кроме кербалов.
	@synopsis = Проанализируйте образец грунта из @/biome1 на борту @/targetVessel1
	@completedMessage = Теперь мы стали лучше понимать то, о чём не имеем ни малейшего понятия!
	@notes = Ваша станция должна уметь обрабатывать образец (с помощью мобильной лаборатории или спектрометрона WT-SIT).
