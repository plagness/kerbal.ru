	@genericDescription = Судя по всему, морить кербонавтов голодом — плохо для репутации. Подбросьте припасов на станцию.
	@notes = Этому контракту неважно, сколько жизнеобеспечения вы возьмёте... но учтите: следующий такой шанс может выпасть нескоро.
