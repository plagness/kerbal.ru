// KerbinSpaceStation (Bases and Stations) — русификация верхнеуровневых текстовых полей.
// ПЕРЕ-ПЕРЕВОД: каждое CC-выражение (@/x) окружено ASCII-пробелами, справа от него ВСЕГДА
// русское слово или конец поля — НИКОГДА пунктуация/цифра вплотную (защита CC-парсера).
// Токены сохранены дословно: @/targetVessel1, @/targetBody1, @/targetKerbal1, @/Counter, @targetBody1 и т.д.

// ===== AGENT =====
@AGENT[Duna?One]:FINAL
{
	@description = Duna One занимается развёртыванием и обслуживанием космических станций и баз на всех мирах системы Kerbol.
}

// ===== CONTRACT_GROUP =====
@CONTRACT_GROUP[BasesandStations]:FINAL
{
	@displayName = Базы и станции
}

// ===== StationMissions =====
@CONTRACT_TYPE[ScienceLab]:FINAL
{
	@title = Пристыкуйте к @/targetVessel1 мобильную лабораторию MPL-LG-2
	@genericTitle = Добавьте мобильную лабораторию MPL-LG-2 к станции
	@description = Теперь, когда мы знаем, что можем продержаться в космосе несколько дней, пора заняться там наукой посерьёзнее.
	@genericDescription = Ну и как заниматься наукой без лаборатории, а?
	@synopsis = Пристыкуйте к @/targetVessel1 мобильную лабораторию MPL-LG-2.
	@completedMessage = Отлично! Теперь мы можем и дальше двигать вперёд род кербалов!
	@PARAMETER[PartValidation]{@title = Запустите новую мобильную лабораторию MPL-LG-2 к @/targetVessel1 .}
	@PARAMETER[Docking]{@title = Состыкуйтесь с @/targetVessel1}
}

@CONTRACT_TYPE[StationCoreCombined]:FINAL
{
	@title = Запустите космическую станцию @/targetBody1 на орбиту!
	@genericTitle = Запустите новую космическую станцию
	@description = Чтобы помочь нам в исследовании @/targetBody1 мы просим вас запустить космическую станцию.
	@genericDescription = Мы просим вас развернуть новую космическую станцию.
	@synopsis = Запустите космическую станцию @/targetBody1 на орбиту!
	@completedMessage = Станция готова!
	@PARAMETER[NewStation]
	{
		@title = Запустите новый базовый модуль станции на заданную орбиту вокруг @/targetBody1 .
		@PARAMETER[HabModuleChild]{@title = Обеспечьте вместимость для 4 кербалов}
		@PARAMETER[RTGSolar]
		{
			@title = Обзаведитесь одним из следующих источников энергии
			@PARAMETER[PartValidationSolar]{@title = 1 и более солнечных панелей}
			@PARAMETER[PartValidationRTG]{@title = 1 и более генераторов}
			@PARAMETER[PartValidationNearFutureSolar]{@title = 1 и более изогнутых солнечных панелей}
			@PARAMETER[PartValidationNearFutureReactors]{@title = 1 и более реакторов деления}
			@PARAMETER[PartValidationNearFutureRTGs]{@title = 1 и более радиоизотопных генераторов}
		}
		@PARAMETER[PartValidationSSPX]
		{
			@title = Включите базовый модуль станции и жилой отсек
			@PARAMETER[PartValidationStationCore]{@title = Включите базовый модуль станции из Station Parts Expansion}
			@PARAMETER[PartValidHab]
			{
				@title = Включите один из следующих жилых модулей
				@PARAMETER[PartValidationHab,0]{@title = Жилой контейнер PPD-10 Hitchhiker}
				@PARAMETER[PartValidationHab,1]{@title = Жилой модуль из Station Parts Expansion}
				@PARAMETER[PartValidationHabTokamak]{@title = Жилой модуль из Tokamak Industries}
			}
		}
	}
	@PARAMETER[Any]
	{
		@PARAMETER[PartValidation,0]{@title = Включите штатный купол (опционально)}
		@PARAMETER[PartValidation,1]{@title = Включите купол из Station Parts Expansion (опционально)}
		@PARAMETER[PartValidation,2]{@title = Включите купол из HabTech2 (опционально)}
		@PARAMETER[PartValidation,3]{@title = Включите купол из Planetary Base Inc (опционально)}
		@PARAMETER[PartValidation,4]{@title = Включите купол из Tokamak Industries (опционально)}
		@PARAMETER[PartValidation,5]{@title = Включите купол из Tantares (опционально)}
		@PARAMETER[Supplies]{@title = Имейте на борту припасы}
		@PARAMETER[ScienceModuleValidation]
		{
			@PARAMETER[ScienceLab]{@title = Включите мобильную лабораторию MPL-LG-2}
			@PARAMETER[PartValidation,0]{@title = Включите исследовательскую лабораторию TH-NKR}
			@PARAMETER[PartValidation,1]{@title = Включите научную лабораторию}
		}
	}
	@REQUIREMENT[SunCheck]{@title = Целевое тело не должно быть Солнцем}
}

// ===== MaintenanceMissions =====
@CONTRACT_TYPE[RepairFaultyModule]:FINAL
{
	@title = Отремонтируйте неисправный энергомодуль на @/targetVessel1
	@genericTitle = Отремонтируйте неисправный энергомодуль
	@description = Телеметрия показывает, что энергомодуль на @/targetVessel1 барахлит. Отправьте инженера, чтобы починить его.
	@genericDescription = Телеметрия показывает, что энергомодуль барахлит. Отправьте инженера, чтобы починить его.
	@synopsis = Отправьте инженера в открытый космос, чтобы починить неисправный энергомодуль.
	@completedMessage = Телеметрия в норме. Неисправный модуль отремонтирован!
	@PARAMETER[Sequence]
	{
		@PARAMETER[VesselParameterGroup]{@PARAMETER[HasCrew]{@title = Кербал должен быть инженером и находиться на борту @/targetVessel1}}
	}
	@REQUIREMENT[StationCheck]{@title = Станция должна быть на орбите}
	@REQUIREMENT[RandomRoll]{@title = Удача должна быть на вашей стороне}
}

@CONTRACT_TYPE[MedicalEmergency]:FINAL
