// kerbal.ru — русификация контракт-пака UnmannedContracts (Spacetux, Contract Configurator)
// Безопасные MM-патчи по имени узла. Только верхнеуровневые текстовые поля
// (genericTitle/title/synopsis/completedMessage). PARAMETER {} / REQUIREMENT {} не трогаем —
// вложенные title (Sequence_1, Expression_HasSurface) это логика, не игровой текст.
// В этом паке нет узлов AGENT {} (agent = Space Penguins, Inc задан в другом паке/файле).
// notes/topic/subject/motivation не переводим — это шаблонные поля автогенератора
// описания Contract Configurator, а не литеральный текст.
// ВАЖНО: каждое CC-выражение (@STGUnmannedMissions:UnmannedMissionPlanet и т.п.)
// окружено ASCII-пробелами, вплотную к нему пунктуация не ставится.
// "Kolniya"/"Tundra" — названия типов орбит (пародия на Молнию / реальная Тундра),
// переведены как «орбита Колния» / «орбита Тундра» для консистентности с флейвор-текстом.

@CONTRACT_TYPE[First?Orbit]:FINAL
{
	@title = Выведите зонд на орбиту
	@synopsis = Отправьте зонд в космос и выведите его на орбиту вокруг нашей родной планеты
	@completedMessage = Получилось! Вы успешно вывели зонд на орбиту
}

@CONTRACT_TYPE[First?Return?from?Orbit]:FINAL
{
	@title = Выведите зонд на орбиту и верните домой
	@synopsis = Отправьте зонд в космос, выведите его на орбиту вокруг родной планеты, а затем верните обратно
	@completedMessage = Получилось! Вы успешно вывели зонд на орбиту и вернули его домой
}

@CONTRACT_TYPE[First?Unmanned?Flyby]:FINAL
{
	@genericTitle = Совершите беспилотный облёт
	@title = Выполните беспилотный облёт @STGUnmannedMissions:UnmannedMissionPlanet зондом.
	@synopsis = Отправьте зонд в пределы сферы притяжения @STGUnmannedMissions:UnmannedMissionPlanet
	@completedMessage = Получилось! Мы совершили облёт @STGUnmannedMissions:UnmannedMissionPlanet зондом.
}

@CONTRACT_TYPE[First?Impact]:FINAL
{
	@genericTitle = Разбейте зонд о планету
	@title = Разбейте зонд о поверхность @STGUnmannedMissions:UnmannedMissionPlanet !
	@synopsis = Запустите беспилотный зонд и разбейте его о поверхность @STGUnmannedMissions:UnmannedMissionPlanet
	@completedMessage = Будущие поколения запомнят этот день.
}

@CONTRACT_TYPE[Targeted?Impact]:FINAL
{
	@genericTitle = Разбейте зонд о цель
	@title = Разбейте зонд о цель на поверхности @STGUnmannedMissions:UnmannedMissionPlanet !
	@synopsis = Запустите беспилотный зонд и разбейте его о поверхность @STGUnmannedMissions:UnmannedMissionPlanet в заданной точке
	@completedMessage = Будущие поколения запомнят этот день.
}

