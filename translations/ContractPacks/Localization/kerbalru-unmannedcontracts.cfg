	@title = Выведите зонд на орбиту @STGUnmannedMissions:UnmannedMissionPlanet
	@synopsis = Выведите спутник на орбиту @STGUnmannedMissions:UnmannedMissionPlanet .
	@completedMessage = Получилось! Мы вывели спутник на орбиту @STGUnmannedMissions:UnmannedMissionPlanet ! Этот день запомнится надолго.
}

