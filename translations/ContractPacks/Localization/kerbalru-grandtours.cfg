// kerbal.ru — русификация контракт-пака Grand Tours (Spacetux, Contract Configurator)
// Безопасные MM-патчи по имени узла. Верхнеуровневые текстовые поля
// (title/description/synopsis/completedMessage) + содержательные PARAMETER title=.
// В этом паке нет узлов AGENT {} и CC-выражений (@-ссылок) — все строки буквальные.
// ВАЖНО: каждое CC-выражение (если появится) окружено ASCII-пробелами,
// справа всегда идёт слово, без пунктуации вплотную.
//
// Структура одинакова во всех 12 CONTRACT_TYPE этого пака (сверено с исходником):
// CONTRACT_TYPE
//   REQUIREMENT[ReachSpace]           — без title, не переводим
//   PARAMETER[HasCrew]                — без title, не переводим
//   PARAMETER (БЕЗ поля name!, type=VesselParameterGroup) — 2-й PARAMETER-потомок
//     PARAMETER[All]                  — title = "Do these things" — ПЕРЕВОДИМ
//       PARAMETER[ReachState] × N     — без title, не переводим
//     PARAMETER[ReturnHome]           — title закомментирован в исходнике, не переводим
// У узла-обёртки VesselParameterGroup нет поля name= → адресуем позиционным
// селектором @PARAMETER,1 (0-based индекс среди PARAMETER-потомков CONTRACT_TYPE,
// НЕ NODETYPE,* wildcard — здесь нужен ровно один, второй по счёту узел).

@CONTRACT_TYPE[all_planets]:FINAL
{
	@title = Совершите большой тур по всем планетам
	@description = Наш спонсор хочет облететь все планеты и вернуться домой
	@synopsis = Пролетите мимо всех планет: Мохо, Ева, Дюна, Дрес, Джул, Ило
	@completedMessage = Получилось! Вы пролетели мимо каждой планеты.

	@PARAMETER,1
	{
		@PARAMETER[All]
		{
			@title = Выполнить следующее
		}
	}
}

