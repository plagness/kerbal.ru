// kerbal.ru — русификация контракт-пака ExplorationPlus (Contract Configurator)
// Безопасные MM-патчи по имени узла. Только верхнеуровневые текстовые поля.
// ВАЖНО: каждое CC-выражение окружено ASCII-пробелами, справа всегда слово,
// никакой пунктуации, тире или двоеточия вплотную к выражению.

@CONTRACT_TYPE[ExplorationPlus-Apollo]:FINAL
{
	@title = Совершите пилотируемую посадку на @/targetBody1 и возвращение
	@genericTitle = Вернитесь с небесного тела, на которое ранее садились.
	@description = Здесь, в КЦК, мы считаем себя открытыми к освоению новых горизонтов. Вы уже сели на @/targetBody1 однако вам нужно ещё и вернуться!
	@genericDescription = Вернитесь с небесного тела, чтобы показать наши выдающиеся научные достижения!
	@synopsis = Слетайте с экипажем туда-обратно к @/targetBody1
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
}

@CONTRACT_TYPE[ExplorationPlus-FirstSteps]:FINAL
{
