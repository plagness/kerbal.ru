// kerbal.ru — русификация контракт-пака ExplorationPlus (Contract Configurator)
// Безопасные MM-патчи по имени узла. Только верхнеуровневые текстовые поля.
// ВАЖНО: каждое CC-выражение окружено ASCII-пробелами, справа всегда слово,
// никакой пунктуации, тире или двоеточия вплотную к выражению.

@CONTRACT_TYPE[ExplorationPlus-Apollo]:FINAL
{
	@title = Совершите пилотируемую посадку на @/targetBody1 и возвращение
	@genericTitle = Вернитесь с небесного тела, на которое ранее садились.
	@description = Здесь, в КЦК, мы считаем себя открытыми к освоению новых горизонтов. Вы уже сели на @/targetBody1 однако вам нужно ещё и вернуться!
	@genericDescription = Вернитесь с небесного тела, чтобы показать наши выдающиеся научные достижения!
	@synopsis = Слетайте с экипажем туда-обратно к @/targetBody1
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
	@DATA,0
	{
		@title = Должны были сесть на небесное тело, но не вернуться с него.
	}
	@PARAMETER[ReturnerDefine]
	{
		@PARAMETER[ReachState]
		{
			@title = Сядьте на @/targetBody1
		}
		@PARAMETER[HasCrew]
		{
			@title = На борту должен быть кербонавт
		}
	}
	@PARAMETER[ReturnerCatch]
	{
		@PARAMETER[ReturnHome]
		{
			@title = Вернитесь домой
		}
	}
	@REQUIREMENT[ReturnFromSurface]
	{
		@title = Не должны были вернуться с целевого тела в пилотируемой миссии
	}
}

@CONTRACT_TYPE[ExplorationPlus-FirstSteps]:FINAL
{
	@title = Займёмся наукой!
	@genericTitle = Займёмся наукой!
	@description = Прежде всего нужно проверить снаряжение — будьте хорошим кербонавтом и соберите немного науки. Желательно на большой скорости.
	@synopsis = Начните космическую программу
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
	@PARAMETER[CollectScience]
	{
		@title = Верните первые научные данные.
	}
	@PARAMETER[FirstLaunch]
	{
		@title = Запустите аппарат в воздух
	}
}

@CONTRACT_TYPE[ExplorationPlus-FlyBy]:FINAL
{
	@title = Начните исследовать @/targetBody1
	@genericTitle = Начните исследовать небесное тело
	@description = В КЦК мы считаем себя открытыми к освоению новых горизонтов. Хотим, чтобы вы отправились к @/targetBody1 и посмотрели, что там есть.
	@genericDescription = Отправляйтесь к новому небесному телу, чтобы посмотреть, что там есть.
	@synopsis = Начните изучение @/targetBody1
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
	@DATA,0
	{
		@title = Есть ещё непосещённые тела.
	}
	@PARAMETER[ReachState,0]
	{
		@title = Пролетите мимо @/targetBody1
	}
	@PARAMETER[ReachState,1]
	{
		@title = Облетите @/targetBody1
	}
	@PARAMETER[CollectScience]
	{
		@title = Верните первые научные данные с @/targetBody1
	}
	@REQUIREMENT[ReachOrbit]
	{
		@title = Впервые должны выйти на орбиту.
	}
}

@CONTRACT_TYPE[ExplorationPlus-Gemini]:FINAL
{
	@title = Совершите пилотируемое возвращение с орбиты @/targetBody1
	@genericTitle = Вернитесь с небесного тела, которое ранее облетали
	@description = Здесь, в КЦК, мы считаем себя открытыми к освоению новых горизонтов. Вы уже сели на @/targetBody1 однако вам нужно ещё и вернуться!
	@genericDescription = Вернитесь с небесного тела, чтобы показать наши выдающиеся научные достижения!
	@synopsis = Слетайте с экипажем туда-обратно к @/targetBody1
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
	@DATA,0
	{
		@title = Должны были облететь небесное тело, но не вернуться с него.
	}
	@PARAMETER[ReturnerDefine]
	{
		@PARAMETER[ReachState]
		{
			@title = Облетите @/targetBody1
		}
		@PARAMETER[HasCrew]
		{
			@title = На борту должен быть кербонавт
		}
	}
	@PARAMETER[ReturnerCatch]
	{
		@PARAMETER[ReturnHome]
		{
			@title = Вернитесь домой
		}
	}
	@REQUIREMENT[ReturnFromOrbit]
	{
		@title = Не должны были вернуться с орбиты целевого тела в пилотируемой миссии
	}
}

@CONTRACT_TYPE[ExplorationPlus-Landing]:FINAL
{
	@title = Сядьте на @/targetBody1
	@genericTitle = Сядьте на небесное тело
	@description = В КЦК мы считаем себя открытыми к освоению новых горизонтов. Хотим, чтобы вы отправились к @/targetBody1 и посмотрели, что там есть.
	@genericDescription = Сядьте на небесное тело, чтобы посмотреть, что там есть.
	@synopsis = Продолжите изучение @/targetBody1
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
	@DATA,0
	{
		@title = Должны были облететь небесное тело, но не сесть на него.
	}
	@PARAMETER[ReachState]
	{
		@title = Сядьте на @/targetBody1
	}
	@REQUIREMENT[Landed]
	{
		@title = Не должны были сесть на целевое тело.
	}
	@REQUIREMENT[SplashDown]
	{
		@title = Не должны были приводниться на целевое тело.
	}
}

@CONTRACT_TYPE[ExplorationPlus-Orbit]:FINAL
{
	@title = Облетите @/targetBody1
	@genericTitle = Облетите небесное тело
	@description = В КЦК мы считаем себя открытыми к освоению новых горизонтов. Хотим, чтобы вы отправились к @/targetBody1 и посмотрели, что там есть.
	@genericDescription = Облетите небесное тело, чтобы посмотреть, что там есть.
	@synopsis = Выйдите на орбиту @/targetBody1
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
	@DATA,0
	{
		@title = Должны были достичь тела, но не выйти на орбиту.
	}
	@PARAMETER[ReachState]
	{
		@title = Облетите @/targetBody1
	}
	@REQUIREMENT[ReachOrbit]
	{
		@title = Не должны были выйти на орбиту целевого тела.
	}
}

@CONTRACT_TYPE[ExplorationPlus-OrbitalManoeuvres]:FINAL
{
	@title = Выполните серию орбитальных манёвров на орбите родного мира.
	@description = Чтобы облегчить разработку более сложных миссий, нам нужно показать нужные навыки — сближение и стыковку.
	@synopsis = Выполните серию орбитальных манёвров над родным миром.
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
	@PARAMETER[RendezvousAndDocking]
	{
		@PARAMETER[Rendezvous]
		{
			@REQUIREMENT[Rendezvous]
			{
				@title = Не должны были совершить орбитальное сближение
			}
		}
	}
	@PARAMETER[Spacewalk]
	{
		@PARAMETER[EVA]
		{
			@title = Совершите выход в открытый космос
		}
	}
	@REQUIREMENT[PartModuleUnlocked]
	{
		@title = Должны быть разблокированы стыковочные узлы.
	}
	@REQUIREMENT[Rendezvous]
	{
		@title = Не должны были совершить орбитальное сближение
	}
}

@CONTRACT_TYPE[ExplorationPlus-ReachSpace]:FINAL
{
	@title = Дотянитесь до звёзд
	@genericTitle = Дотянитесь до звёзд
	@description = Пора разорвать оковы гравитации и коснуться звёзд. Что? А, то есть — полетели в космос.
	@synopsis = Начните космическую программу
	@completedMessage = Ура! Нет такой вещи, как последний рубеж.
	@REQUIREMENT[ReachSpace]
	{
		@title = Не должны были достичь космоса.
	}
}

