// kerbal.ru — русификация контракт-пака Constellations (Contract Configurator)
// Безопасные MM-патчи по имени узла. Только верхнеуровневые текстовые поля.
// ПРАВИЛО БЕЗОПАСНОСТИ: каждое CC-выражение (переменные вида "собака слэш x" / "собака x",
//   вызовы .Method() и HomeWorld(), конкатенации со знаком плюс) отделено ASCII-пробелом,
//   и сразу за ним идёт РУССКОЕ СЛОВО — никогда не : , . ! ? тире « » " ) или цифра.
// Все токены (переменные, .Print(), .ElementAt(...), обратный слэш n, конкатенации) сохранены дословно.

// ============================ АГЕНТСТВА ============================

@AGENT[CommTech]:FINAL
{
	@description = Мировой гигант медиа и телекоммуникаций. Без лишних хлопот соединяет кербалов всеми возможными способами — от вещательных сетей до мобильной связи.
}

@AGENT[Frontier?Link]:FINAL
{
	@description = Международный кооператив, нацеленный на расширение радиопокрытия кербалов по всей системе Кербола.
}

@AGENT[KPS]:FINAL
{
	@description = Kerbstar Kerbal Positioning System — проект навигационной спутниковой системы.
}

@AGENT[Kerbal?Society?for?Science]:FINAL
{
	@description = Некоммерческое научное агентство.
}

// ============================ ГРУППЫ ============================
// KPSConstellations (displayName = KPS) намеренно не трогаем — это бренд/код.

@CONTRACT_GROUP[Constellations]:FINAL
{
	@displayName = Группировки
}

@CONTRACT_GROUP[KerbinConstellations]:FINAL
{
	@displayName = Спутники Кербина
}

@CONTRACT_GROUP[RelayConstellations]:FINAL
{
	@displayName = Сети ретрансляторов
}

@CONTRACT_GROUP[SentinelConstellations]:FINAL
{
	@displayName = Телескоп SENTINEL
}

@CONTRACT_GROUP[StationKeepConstellations]:FINAL
{
	@displayName = Удержание позиции
}

// ============================ ТИПЫ КОНТРАКТОВ: Relays ============================

@CONTRACT_TYPE[PlanetRelayFollowUp]:FINAL
{
	@title = Улучшите покрытие связи для @/targetBody
	@genericTitle = Улучшите покрытие связи планеты
	@description = Мы пришли к выводу, что нынешнее покрытие связи @/targetBody оставляет желать лучшего. Ещё два ретранслятора обеспечат постоянное покрытие большей части поверхности.
	@genericDescription = Образуйте равносторонний треугольник ретрансляторов на орбите планеты
	@synopsis = "Добавьте ещё два ретранслятора и образуйте равносторонний треугольник ретрансляторов на орбите "+@/targetBody
	@notes = Целевой период: @/ogPeriod
	@completedMessage = Ретрансляторы на позиции и работают!

	@REQUIREMENT[StillValid]
	{
		@title = Исходный ретранслятор всё ещё на допустимой орбите
	}
	@REQUIREMENT[Any]
	{
		@REQUIREMENT[Cooldown]
		{
			@title = С момента установки исходного ретранслятора должно пройти не менее @Constellations:constellationCD
		}
		@REQUIREMENT[YouRascal]
		{
			@title = В сфере влияния небесного тела уже несколько ретрансляторов (не заставлять игрока ждать)
		}
	}
	@PARAMETER["Relay"+@idx]
	{
		@PARAMETER[Any]
		{
			@title = Иметь на борту генератор энергии
			@PARAMETER[PartValidation,0]
			{
				@title = 1 или более солнечных панелей
			}
			@PARAMETER[PartValidation,1]
			{
				@title = 1 или более генераторов
			}
			@PARAMETER[PartValidation,2]
			{
				@title = 1 или более изогнутых солнечных панелей
			}
			@PARAMETER[PartValidation,3]
			{
				@title = 1 или более реакторов деления
			}
			@PARAMETER[PartValidation,4]
			{
				@title = 1 или более радиоизотопных генераторов
			}
			@PARAMETER[PartValidation,5]
			{
				@title = 1 или более солнечных панелей
			}
		}
		@PARAMETER[Orbit]
		{
			@title = Скруглить орбиту на высоте @/intAlt.Print() м с отклонением менее @/altThreshold1.ToString("N0") м
		}
		@PARAMETER[Rendezvous]
		{
			@title = Удерживать ретранслятор в пределах @/kmDistThreshold1.Print() км от @/markers.ElementAt(@../idx)
		}
		@PARAMETER[VesselParameterGroup]
		{
			@title = Запустить новый аппарат (опционально)
		}
		@PARAMETER[Precision1]
		{
			@title = Скруглить орбиту на высоте @/intAlt.Print() м с отклонением менее @/altThreshold2.ToString("N0") м (опционально)
		}
		@PARAMETER[Precision2]
		{
			@title = Скруглить орбиту на высоте @/intAlt.Print() м с отклонением менее @/altThreshold3.ToString("N0") м (опционально)
		}
	}
}

@CONTRACT_TYPE[KsoRelayFollowUp]:FINAL
{
	@title = Разместите ещё два ретранслятора на кеостационарной орбите
	@description = Ретранслятор над КЦ — это здорово, но он не достаёт до обратной стороны Кербина. Нужны ещё два спутника, чтобы образовать равносторонний треугольник — это должно дать покрытие на все 360 градусов.
	@synopsis = Образуйте равносторонний треугольник ретрансляторов на кеостационарной орбите
	@notes = Требуемая ΔV с низкой орбиты @/targetBody составляет @/deltaV.Print() м/с \nНе забудьте оставить топливо для удержания позиции!
	@completedMessage = Ретрансляторы на позиции и работают!

	@REQUIREMENT[Either]
	{
		@title = Требуется установить первый кеостационарный ретранслятор по контракту не раньше чем @Constellations:constellationCD2 назад
	}
	@REQUIREMENT[ValidOrbit]
	{
		@title = Исходный ретранслятор всё ещё на допустимой орбите
	}
	@PARAMETER["Relay"+@idx]
	{
		@PARAMETER[PowerGenerator]
		{
			@title = Иметь на борту солнечные панели
		}
		@PARAMETER[Orbit]
		{
			@title = Скруглить орбиту на высоте @/intAlt.Print() м с отклонением менее @/altThreshold1.ToString("N0") м
		}
		@PARAMETER[Rendezvous]
		{
			@title = Удерживать ретранслятор в пределах @/kmDistThreshold1.Print() км от @/markers.ElementAt(@../idx)
		}
		@PARAMETER[Precision1]
		{
			@title = Скруглить орбиту на высоте @/intAlt.Print() м с отклонением менее @/altThreshold2.ToString("N0") м (опционально)
		}
		@PARAMETER[Precision2]
		{
			@title = Скруглить орбиту на высоте @/intAlt.Print() м с отклонением менее @/altThreshold3.ToString("N0") м (опционально)
		}
	}
}

