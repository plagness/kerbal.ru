// kerbal.ru — русификация контракт-пака Research Advancement Division (RAD, Contract Configurator)
// Безопасные MM-патчи по имени узла. Верхний уровень + содержательные PARAMETER/REQUIREMENT title.
// REQUIREMENT-узлы типа Expression не имеют поля name — селекторы @REQUIREMENT,N индексные
// (0-based по порядку в исходнике), это отдельный синтаксис от @REQUIREMENT[name].
// AGENT/CONTRACT_TYPE.name без пробелов не переводим, значения @title у AGENT не трогаем
// (бренд-агентство — тот же прецедент, что CommTech/Frontier Link в kerbalru-constellations.cfg).

@CONTRACT_GROUP[RAD]:FINAL
{
	@displayName = Отдел развития исследований
}

@AGENT[Research?Advancement?Division]:FINAL
{
	@description = Research Advancement Division — компания, которую финансируют небедные так называемые «филантропы»-кербалы, уставшие ждать научного прогресса, зависящего от того, в какую сторону взорвутся наши ракеты. Они решили взять дело в свои руки: платят нам за то, что мы разносим вещи именно там, где скажут. Да ещё и определённым образом. Мы не жалуемся, деньги лишними не бывают.
}

@CONTRACT_TYPE[RAD_Leftovers]:FINAL
{
	@genericTitle = Соберите оставшиеся данные
	@genericDescription = Соберите оставшиеся данные
	@title = Соберите недостающие данные экспериментов на @targetBody
	@description = Нам стало известно, что по части уже проведённых вами экспериментов данные дошли не полностью. Это, разумеется, недопустимо — как нам это объяснить начальству?! Немедленно исправьте положение. Постарайтесь, а то в отделе испытаний как раз найдётся вакансия для вас. Уверены, вы понимаете.
	@synopsis = <color=yellow>Соберите оставшиеся данные экспериментов на @targetBody. Обратите внимание на нужный метод возврата данных!</color>
	@completedMessage = Наконец-то приличные данные. Можете продолжать... пока что.

	@REQUIREMENT,0
	{
		@title = Нужен подходящий биом для изучения
	}
}

@CONTRACT_TYPE[RAD_Surface]:FINAL
{
	@genericTitle = Соберите данные с поверхности
	@genericDescription = Соберите данные с поверхности
	@title = Соберите данные с поверхности в районе @biome1
	@description = Мы получили неплохие снимки поверхности @targetBody. Обычно это не ваша забота, но с этими фотографиями что-то не так. Наши лучшие халаты в недоумении, даже уборщик развёл руками. Тут какое-то пятно, видите? Или клякса? Крапинка? А может, просто смазано..? Неважно, что бы это ни было, находится оно в районе @biome1. Слетайте туда и добудьте подробные данные с близкого расстояния. Спуститесь на поверхность в этом месте и доложите, что нашли.
	@synopsis = <color=yellow>Отправьте аппарат на поверхность @targetBody и проведите нужные эксперименты.</color>
	@completedMessage = Странно, собранные данные не показывают ничего необычного. До чего неудовлетворительно. Уборщика всё равно уволим.

	@REQUIREMENT,0
	{
		@title = Нужен подходящий биом для изучения
	}
}

@CONTRACT_TYPE[RAD_SurfaceMulti]:FINAL
{
	@genericTitle = Проанализируйте поверхность
	@genericDescription = Проанализируйте поверхность в разных местах
	@title = Проанализируйте поверхность в районах @biome1 и @biome2
	@description = У одного из наших штатных учёных случилось озарение. Он утверждает, что данные экспериментов станут точнее, если повторить их в нескольких местах. Что-то там про причинность, корреляцию, значимость и прочее. Не переживайте, мы и сами не очень поняли. Суть в том, что энтузиазм учёного выбил у спонсоров дополнительный бюджет. При условии, что мы правда проведём эти эксперименты. А заниматься такой рутиной самим нам, разумеется, недосуг. Отправляйтесь и проанализируйте @biome1 и @biome2 с поверхности вместо нас.
	@synopsis = <color=yellow>Отправьте аппарат на поверхность @targetBody в районы @biome1 и @biome2 и проведите нужные эксперименты.</color>
	@completedMessage = Так-так. Похоже, наш дорогой учёный не так уж и спятил. Только не говорите ему — не то захочет повышения, прибавки или ещё какой сложности на нашу голову.

	@REQUIREMENT,0
	{
		@title = Нужно достаточно науки в первой зоне
	}
	@REQUIREMENT,1
	{
		@title = Нужно также достаточно науки во второй зоне
	}
	@PARAMETER[CollectScience1]
	{
		@title = Займитесь наукой здесь
	}
	@PARAMETER[CollectScience2]
	{
		@title = Также займитесь наукой там
	}
}

@CONTRACT_TYPE[RAD_Orbital]:FINAL
{
	@genericTitle = Проведите орбитальное исследование
	@genericDescription = Проведите орбитальное исследование
	@title = Проведите орбитальное исследование из космоса у @targetBody.
	@description = Мы знаем, что @targetBody — место тайн и интриг. Но прежде всего это место, где мы — точнее, вы — ещё не провели достаточно науки. Отправляйтесь в космос вокруг него и не возвращайтесь, пока не выполните все требуемые эксперименты!
	@synopsis = <color=yellow>Отправьте аппарат в космос вокруг @targetBody и проведите требуемые эксперименты. Учтите нужные высоты.</color>
	@completedMessage = Пока сойдёт. Оставьте результаты на столе.

	@REQUIREMENT,0
	{
		@title = Нужно достаточно объектов изучения
	}
}

@CONTRACT_TYPE[RAD_BiomeObs]:FINAL
{
	@genericTitle = Проведите орбитальное наблюдение биома
	@genericDescription = Проведите орбитальное наблюдение биома
	@title = Наблюдайте @biome1 и @biome2 из космоса
	@description = Мы заинтересовались некоторыми участками на @targetBody. Чисто в научных целях, разумеется. Хотим, чтобы вы изучили @biome1 и @biome2. Только не подлетайте слишком близко, это было бы подозри-... вредно для нужных нам данных. Лучше сделать это с орбиты. Да, оставайтесь там, подальше, этого вполне хватит. А теперь брысь.
	@synopsis = <color=yellow>Отправьте аппарат в космос вокруг @targetBody, проследив, чтобы орбита проходила через нужные участки, и проведите требуемые эксперименты.</color>
	@completedMessage = Хорошо, хорошо, отличные разведданные *кхм* научные данные вы собрали. Дальше мы сами!

	@REQUIREMENT,0
	{
		@title = Нужно достаточно науки в первой зоне
	}
	@REQUIREMENT,1
	{
		@title = Нужно также достаточно науки во второй зоне
	}
	@PARAMETER[CollectScience1]
	{
		@title = Займитесь наукой здесь
	}
	@PARAMETER[CollectScience2]
	{
		@title = Также займитесь наукой там
	}
}

@CONTRACT_TYPE[RAD_LocalFlight]:FINAL
{
	@genericTitle = Выполните локальный наблюдательный полёт
	@genericDescription = Выполните локальный наблюдательный полёт
	@title = Выполните наблюдательный полёт над @biome1
	@description = Уверены, вы знаете о существовании @biome1. Мы уж точно знаем. А вот чего вы можете не знать — мы считаем @biome1 странным местом. Точнее, согласно нашему сверхсекретному **REDACTED**, у этой области высокий потенциал для **REDACTED**. Единственный способ убедиться — отправить туда технику и проверить.
	@synopsis = <color=yellow>Отправьте аппарат в небо над @biome1 и проведите требуемые эксперименты.</color>
	@completedMessage = Какие чудесные новости! Эти открытия наверняка навсегда изменят **REDACTED** нашего великого **REDACTED**!

	@REQUIREMENT,0
	{
		@title = Нужен подходящий биом для изучения
	}
}

@CONTRACT_TYPE[RAD_Atmo]:FINAL
{
	@genericTitle = Проведите атмосферное исследование
	@genericDescription = Проведите атмосферное исследование
	@title = Исследуйте атмосферу в нескольких районах @targetBody
	@description = При всей этой сосредоточенности на космосе тут немудрено забыть, что есть интересные вещи и не в космосе тоже! Один из наших яйцеголовых сказал нам (даже умолял), что изучение атмосферных явлений не менее ценно для... научной программы. Или он говорил про кондиционер в лаборатории.. Это бы объяснило, почему он позеленел чуть больше обычного. В общем, слетайте туда и добудьте атмосферные данные с небес @targetBody, ладно?
	@synopsis = <color=yellow>Исследуйте атмосферу @targetBody, проведите требуемые эксперименты. Обратите внимание на нужные районы!</color>
	@completedMessage = Да, извините, это точно был кондиционер. Мы уберём ваш отчёт в надёжное место — вдруг кто-то и правда взглянет на него через пару лет. Или сотню.

	@REQUIREMENT,0
	{
		@title = Нужно достаточно науки в первой зоне
	}
	@REQUIREMENT,1
	{
		@title = Нужно также достаточно науки во второй зоне
	}
	@REQUIREMENT,2
	{
		@title = Нужно также достаточно науки в третьей зоне
	}
	@PARAMETER[CollectScience1]
	{
		@title = Займитесь наукой здесь
	}
	@PARAMETER[CollectScience2,0]
	{
		@title = Также займитесь наукой там
	}
	@PARAMETER[CollectScience2,1]
	{
		@title = Ещё наука здесь
	}
}
