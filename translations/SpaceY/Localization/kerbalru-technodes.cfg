// kerbal.ru — узлы дерева технологий SpaceY, оставшиеся на английском.
// Остальные узлы дерева приходят из Community Tech Tree (#LOC_CTT_*, уже переведены);
// эти три SpaceY определяет сам. Патчим RDNode внутри TechTree по полю id.

@TechTree:FINAL
{
	@RDNode:HAS[#id[massiveRocketry]]
	{
		@title = Исполинское ракетостроение
	}
	@RDNode:HAS[#id[massiveStructure]]
	{
		@title = Исполинские конструкции
	}
	@RDNode:HAS[#id[giganticStructure]]
	{
		@title = Гигантские конструкции
	}
}
