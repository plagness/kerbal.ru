// kerbal.ru — русификация деталей DockRotate (3 детали с флейвор-текстом, литерал в part.cfg).
// motorCap.cfg / MotorPoint.cfg — единственные обычные PART-узлы мода; остальной DockRotate
// патчит существующие детали через MODULE (ModuleDockRotate/ModuleNodeRotate) без title/
// description своих — тот текст переведён через keyed-словарь (Localization/ru.cfg).
// manufacturer здесь — шуточные вымышленные названия автора мода, не бренды, переводим.

@PART[motorCap]:FINAL
{
	@title = Заглушка NOB-05 с шаговым мотором
	@manufacturer = Чокнутые Медные Ткачи
	@description = В поисках не столь уродливых моторизованных решений отважные инженеры зарылись глубже в бездонную кучу обломков роботов. Те, кому удалось выбраться обратно, принесли на свет эту моторизованную заглушку. Она вращается вокруг нижнего узла и даёт на роторе достаточно места для крепления других деталей. Либо можно прикрутить её к поверхности самим ротором, превратив ротор в статор — ради каламбура и выгоды.
	@tags = крепление ротор привод вращение мотор
}

@PART[motorPoint0]:FINAL
{
	@title = Шаговый мотор BF-35 (размер 0)
	@manufacturer = Добыто из негабаритного дисковода
	@description = Однажды двое инженеров, умирающих со скуки, решили собрать гигантского робота из б/у ракетных деталей и прочего хлама. Что именно случилось с этим чудищем — неизвестно, но получившаяся куча обломков теперь даёт солидный запас приводов. Прикрутите низ намертво к корпусу корабля — верхнее крепление вращается.
	@tags = крепление ротор привод вращение мотор
}

