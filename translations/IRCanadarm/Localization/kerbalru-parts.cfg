// IRCanadarm (аддон InfernalRoboticsNext — манипулятор Canadarm/Canadarm2) — русификация деталей
// Метод mm-title: title/description/manufacturer/tags литералом в part.cfg → патчим ModuleManager
// прямым оператором @ (:FINAL) поверх исходных значений. Матчинг по полю name узла PART.
// Деталей: 14. «Kanadarm»/«Kanadarm2» — фирменное название деталей мода (сознательная замена C→K
// в реальном имени NASA/CSA «Canadarm», чтобы избежать товарного знака) — оставлено латиницей как
// собственное имя изделия, аналогично сохранённым моделям в других переводах (см. FOR-AGENTS.md).
// Manufacturer «HabTech Consortium» / «Magic Smoke Industries» — бренды, оставлены латиницей.

