// kerbal.ru — русификация HullCameraVDS (сборка «Оператор», сток KSP)
// Метод: mm-title — title/description/manufacturer/tags заданы литералом в part-cfg (или через #autoLOC),
// патчим прямым оператором @ (ModuleManager :FINAL) поверх исходных значений.
// Совпадение по полю name из PART{ name = ... }. Деталей: 21.
// Латиницей оставлены: названия-модели камер (пародии на реальные бренды/термины — KerbPro, Aerocam,
// Kazzelblad 500, BoosterCam, NavCam, ScienceCam, Nightvisioncam, ChemCam, MunCam, TurretCam, HazCam,
// Ordan Industrial Pictozoom 1000/2000 Series), названия компаний-производителей (Magic Smoke Industries,
// Maniacal Mallard Industries, Multiversal Mechatronics, Ordan Industrial, SciSense) и ссылка на другой
// мод (Neptune Cam).
// Примечание: у детали hc_kazzelblad в исходнике title ссылается на чужой ключ локализации
// (#autoLOC_HULL_PART_003 = BoosterCam) — очевидная опечатка мода; переведено по фактическому смыслу
// детали (Kazzelblad 500), как и указано в комментарии исходной строки.

@PART[kerbpro]:FINAL
{
	@title = KerbPro
	@manufacturer = Magic Smoke Industries
	@description = KerbPro — чрезвычайно прочная камера, которую обычно используют в разных видах спорта. В Kerbal Space Program решили проверить, выдержит ли она полёт на ракете в качестве бортовой камеры. Время покажет.
	@tags = камера корпус наука
}

@PART[Telescope]:FINAL
{
	@title = Ordan Industrial Pictozoom 1000 Series
	@manufacturer = Ordan Industrial in association with Probodobodyne
	@description = Однажды Джеб возился с камерой и «случайно» дёрнул рычаг с надписью НЕ ТРОГАТЬ. После пугающе увеличенных снимков перепуганных глаз Билла решили, что это тоже можно прикрутить к носу ракеты вместо телескопа.
	@tags = камера телескоп наука корпус
}

@PART[Pictozoom_2000]:FINAL
{
	@title = Ordan Industrial KOMMAND-R Pictozoom 2000 Series Variable Aperture Spectograph Net
	@manufacturer = Ordan Industrial
	@description = После официального выговора Джебу за безрассудство (ему не дали сока на обед) инженеры спроектировали более модульный и устойчивый телескоп — проверять причёски кербонавтов на аккуратность и блох.
	@tags = камера телескоп наука
}

@PART[aerocam180]:FINAL
{
	@title = Aerocam 180
	@manufacturer = Magic Smoke Industries
	@description = Aerocam — это потрошённый KerbPro в аэродинамическом корпусе. Теперь KerbPro не будет тормозить ваш аппарат. У этой версии перевёрнута матрица (CCD), так что вы больше не почувствуете, будто висите вверх ногами под горизонтальным аппаратом.
}

