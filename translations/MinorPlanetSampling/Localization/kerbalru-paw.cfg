// MinorPlanetSampling — мод целиком в DLL (Harmony-патч, позволяющий беспилотным зондам брать
// научные пробы астероидов/комет), текста в коде нет (проверено strings по MinorPlanetSampling.dll —
// только имена типов/методов, никаких строк интерфейса). Единственный видимый игроку текст — два
// PAW-лейбла ModuleScienceContainer, добавленного AddScienceContainers.cfg двум деталям сканеров:
// reviewActionName/storeActionName заданы литералом (не через #LOC). :FINAL, чтобы точно применяться
// после AddScienceContainers.cfg этого же мода.
//
// RobotArmScanner_S* (рука-сканер из Breaking Ground / Serenity) — деталь недоступна без DLC-моста
// SquadExpansion/Serenity, в текущей сборке не установлена; патч неno-op только у тех, кто её ставит.

@PART[SurfaceScanner]:NEEDS[MinorPlanetSampling]:FINAL
{
	@MODULE[ModuleScienceContainer]
	{
		@reviewActionName = Просмотреть сохранённый образец
		@storeActionName = Сохранить образец
	}
}

@PART[RobotArmScanner_S*]:NEEDS[MinorPlanetSampling&SquadExpansion/Serenity]:FINAL
{
	@MODULE[ModuleScienceContainer]
	{
		@reviewActionName = Просмотреть сохранённый образец
		@storeActionName = Сохранить образец
	}
}
