// kerbal.ru — русификация контрактов Strategia (генерируются по принятым стратегиям)
//   Мод не использует систему локализации: title/desc зашиты в .cfg.
//   Перевод — ModuleManager-патч по дословному полю name узла, проход :FINAL
//   (применяется последним, поверх любых ретрофит-патчей от других модов).
//
//   ВАЖНО про поля верхнего уровня CONTRACT_TYPE: title/description/synopsis/
//   completedMessage здесь — НЕ литеральный текст, а CC-выражения
//   (title = @strategy, description = @strategy.description() и т.п.),
//   берущие текст динамически из АКТИВНОЙ связанной стратегии
//   (см. kerbalru-strategies.cfg). Эти выражения НЕ трогаем — переводится
//   только genericTitle/genericDescription (показываются до принятия
//   стратегии, в списке доступных типов контрактов) и DATA.title
//   (единственное содержательное REQUIREMENT-подобное поле — показывается
//   в панели «Требования» Mission Control как «The pre-requisite strategy
//   must be taken»).
//
//   PARAMETER.title переведён только там, где это литеральный текст.
//   Вложенные PARAMETER с title = @biome.Name() / @body.Name() /
//   @flyByTarget.Name() / @childBody.Name() — CC-ссылки на динамическое имя
//   тела/биома, не текст, не трогаем (как и @strategy выше).
//
//   DATA-узел с содержательным title достаётся селектором по типу
//   :HAS[#type[StrategiaStrategy]] — среди трёх DATA-узлов в каждом
//   контракте только у него есть поле title, у остальных (string,
//   List<CelestialBody>/List<Biome>) title нет.

// ============================================================
//  ГРУППА КОНТРАКТОВ И АГЕНТСТВО
// ============================================================

@CONTRACT_GROUP[Strategia]:FINAL
{
    @tip = Стратегия…
}

@AGENT[Strategia]:FINAL
{
    @description = Стратегические инициативы по всему миру!
}

// ============================================================
//  STG_BodyProgram — программы по лунам/планетам (BodyProgram.cfg)
// ============================================================

@CONTRACT_TYPE[STG_BodyProgram]:FINAL
{
    @genericTitle = Программы небесных тел
    @genericDescription = Это контракт Strategia, который принимается автоматически при выборе необходимой стратегии.

    @DATA:HAS[#type[StrategiaStrategy]]
    {
        @title = Необходимая стратегия должна быть выбрана
    }
}

