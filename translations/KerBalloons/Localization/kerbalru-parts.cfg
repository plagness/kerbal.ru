// KerBalloons — русификация деталей (шары/баллоны для аэростатических аппаратов).
// Метод: title/description/manufacturer заданы литералом в part.cfg → патчим ModuleManager по имени
// детали (поле name в узле PART/PARTUPGRADE). Локализации (#LOC) у мода нет вообще.
//
// SUBTYPE-узлы ModuleB9PartSwitch (размер баллона / планета настройки) поля title изначально
// НЕ имеют — B9PartSwitch показывает name, если title не задан. Добавляем title = ... (без @,
// это ДОБАВЛЕНИЕ нового поля, а не правка) — сам name НЕ трогаем: он используется как внутренний
// идентификатор подтипа. Модули ModuleB9PartSwitch выбираем через :HAS[#moduleID[...]] (оба узла
// называются одинаково "ModuleB9PartSwitch", различаются только moduleID) — тот же паттерн, что
// уже подтверждён рабочим в этой сборке (см. docs/MAINTAINING.md).
//
// selectedPlanetName (Kerbin/Duna/Laythe/Eve внутри DATA{}) — это ключ сопоставления с
// FlightGlobals.currentMainBody.name в рантайме мода, НЕ текст интерфейса. Не трогать.

@PART[KBSunDial]:FINAL
{
	@title = Датчик положения Солнца
	@description = Используется вместе с самописцем данных для записи времени.
}

@PART[KBDataRecorder]:FINAL
{
	@title = Самописец показаний датчиков
	@description = Это удивительное устройство обнаруживает другие датчики и постоянно записывает их показания. (GameData/KerBalloons/LogData)
}

@PART[KBCrossStaff]:FINAL
{
	@title = Палка «где мы находимся»
	@description = Мы не уверены почему, но каждый раз, когда тыкаем этой палкой себе в глаз, мы понимаем, где находимся.
}

