@PART[universalBalloonHP]:FINAL
{
	@title = Баллон KerBalloon (Кербин) — универсальный шар
	@description = Когда KerBalloons пришли к нам с презентацией своего продукта, первой мыслью было: «Да зачем нам вообще баллоны, если есть ракеты?». Скажем так, мы передумали, когда узнали о потенциальной экономии и научной выгоде.

	@MODULE:HAS[#moduleID[balloonSizeSwitch]]
	{
		@switcherDescription = Размер баллона
		@switcherDescriptionPlural = Размеры баллона
		@SUBTYPE[Size0] { title = Размер 0 (0.625 м) }
		@SUBTYPE[Size1] { title = Размер 1 (1.25 м) }
		@SUBTYPE[Size2] { title = Размер 2 (2.5 м) }
		@SUBTYPE[Size3] { title = Размер 3 (3.75 м) }
	}
	@MODULE:HAS[#moduleID[planetSwitch]]
	{
		@switcherDescription = Планета
		@switcherDescriptionPlural = Планеты
		@SUBTYPE[Kerbin] { title = Кербин }
		@SUBTYPE[Duna] { title = Дюна }
		@SUBTYPE[Laythe] { title = Лейт }
		@SUBTYPE[Eve] { title = Ева }
	}
}

