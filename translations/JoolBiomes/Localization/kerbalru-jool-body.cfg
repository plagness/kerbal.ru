// JoolBiomes — переопределяет описание Джула и добавляет 4 именованных биома облачных поясов
// (Kopernicus/Jool.cfg). Оригинал патчит @Kopernicus:AFTER[Kopernicus] — наш патч идёт :FINAL,
// чтобы точно применяться ПОСЛЕ него (Body[Jool]/Biome[...] уже существуют к этому моменту,
// подтверждено по ModuleManager.ConfigCache).
//
// name у Biome НЕ трогаем (внутренний id, используется для науки/ResearchBodies) — только
// ДОБАВЛЯЕМ displayName, тот же приём, что и в translations/BiomeCorrections для стоковых биомов.
//
// НЕ переведено (осознанно, не баг перевода): JoolBiomes также патчит стоковые эксперименты
// crewReport/evaReport/temperatureScan/gravityScan/atmosphereAnalysis через
// "@EXPERIMENT_DEFINITION[*]:HAS[#id[...]]" — синтаксис с [*] требует поля name у узла (см.
// docs/MAINTAINING.md, разбор EXPERIMENT_DEFINITION/RDNode от 2026-08-02), а EXPERIMENT_DEFINITION
// его не имеет (только id). Проверено по ModuleManager.ConfigCache: ни один из ключей вида
// JoolFlyingLowEquatorialCloudBelt/JoolInSpaceLowGreatGreenSpot и т.п. в кэше НЕ встречается —
// это собственный, ничем не хеленный баг JoolBiomes (эти строки результатов эксперимента никогда
// не показываются игроку, ни на английском, ни на любом другом языке). Переводить нечего; чинить
// чужой мод — вне периметра библиотеки переводов.

@Kopernicus:FINAL
{
	@Body[Jool]
	{
		@Properties
		{
			%description = Джул славится прежде всего своими гигантскими размерами и зелёным цветом. Кербалы мечтали слетать сюда с тех пор, как впервые заметили эту планету на небе. Философы уверяют: раз уж зелёный вихрь так приятно выглядит, значит и слетать туда должно быть приятно. На Джуле есть тёмное пятно — точно исполинский глаз, — которое веками ставит в тупик кербальских учёных. Мнения расходятся: то ли великая планета и вправду подмигивает нам, то ли нет.
			@Biomes
			{
				@Biome[Equatorial?Cloud?Belt]
				{
					%displayName = Экваториальный облачный пояс
				}
				@Biome[Temperate?Cloud?Belt]
				{
					%displayName = Умеренный облачный пояс
				}
				@Biome[Polar?Cloud?Belt]
				{
					%displayName = Полярный облачный пояс
				}
				@Biome[Great?Green?Spot]
				{
					%displayName = Большое зелёное пятно
				}
			}
		}
	}
}
