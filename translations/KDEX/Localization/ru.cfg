Localization
{
	ru
	{
	// KDex
	#KDEX_title = Кербальский пылевой эксперимент
	#KDEX_manufacturer = masTerTorch R&D Center
	#KDEX_description = Внутри этой крошечной банки из-под кофе находится высокочувствительный датчик, измеряющий плотность частиц пыли, ударяющихся о заднюю стенку банки. Теперь можно добывать науку из столкновений!
	#KDEX_tags = эксперимент пыль столкновение исследование сброс перезапуск наука датчик kdex

	#KDEX_startEventGUIName = Открыть крышку
	#KDEX_endEventGUIName = Закрыть крышку
	#KDEX_actionGUIName = Переключить крышку

	#KDEX_experimentActionName = Запустить анализ пыли
	#KDEX_resetActionName = Отклонить данные
	#KDEX_reviewActionName = Просмотреть данные
	#KDEX_collectActionName = Забрать данные


	// Kerbal Dust Experiment: Dust Analysis ScienceDefs (can be moved to another file)
	#KDEX_SD_title = Анализ пыли

	#KDEX_SD_default = Столкнувшиеся зёрна кажутся довольно мелкими.

	#KDEX_SD_InSpace = Пыль собирается в облако в форме блина. Это может вызывать противосияние.

	#KDEX_SD_KerbinSrfLandedLaunchpad = Попадающие в датчик частицы состоят из сгоревшего ракетного топлива.
	#KDEX_SD_KerbinSrfLandedRunway = Частицы, похоже, состоят в основном из тормозной пыли и крошек резины от шин.
	#KDEX_SD_KerbinSrfLandedKSC = Есть основания полагать, что пыль состоит из пыльцы, волос кербалов и волокон скафандра.
	#KDEX_SD_KerbinFlyingLowGrasslands = Плотность зёрен очень похожа на плотность пыльцы… Апчхи!
	#KDEX_SD_KerbinFlyingLowDeserts = Много сильных ударов, едва не повреждающих датчик. Довольно пыльное место.
	#KDEX_SD_KerbinFlyingLowBadlands = Такую же пыль можно найти на книжных полках.
	#KDEX_SD_KerbinFlyingLowShores = Рыхлый сыпучий материал. Вероятно, тот же, что покрывает пляжи, русла рек и пустыни Кербина.
	#KDEX_SD_KerbinFlyingLowIceCaps = Приближается пыль со сложной спектральной сигнатурой.
	#KDEX_SD_KerbinFlyingLowWater = Поступающие частицы выглядят довольно влажными.
	#KDEX_SD_KerbinFlyingLowTundra = Поступающие частицы похожи на кристаллы льда.
	#KDEX_SD_KerbinInSpaceLow = Обнаружены следы чрезвычайно мелких частиц минеральной пыли.
	#KDEX_SD_KerbinInSpaceHigh = Здесь пыль другая. Кажется, она принимает странные формы.

	#KDEX_SD_MunInSpaceHigh = Эта пыль мелкая, как тальк, но какая-то зловредная. Она движется вдоль линий электрического поля и проникает в оборудование.
	#KDEX_SD_MunInSpaceLow = Высокая плотность! Хорошая частота ударов. Пыль на малой высоте, вероятно, способна создавать свечение на закате.
	#KDEX_SD_MunInSpaceLowTwinCraters = За каждым столкновением зерна следует парное столкновение с тем же зарядом.
	#KDEX_SD_MunInSpaceLowEastFarsideCrater = Частота столкновений ниже, но удары сильные.
	#KDEX_SD_MunInSpaceLowMidlandCraters = Частота столкновений ниже, удары слабые.
	#KDEX_SD_MunInSpaceLowMidlands = Частота столкновений и сила ударов на среднем уровне.
	#KDEX_SD_MunInSpaceLowHighlands = Частицы пыли несут высокий заряд.
	#KDEX_SD_MunInSpaceLowPolarLowlands = В датчик попадает очень мало зёрен. Возможно, здесь слишком холодно.
	#KDEX_SD_MunInSpaceLowFarsideCrater = Почти нет столкновений, удары слабые.
	#KDEX_SD_MunSrfLanded = Правда! Экзосфера Муны содержит пыль благодаря электростатической левитации.

	#KDEX_SD_MinmusInSpaceHigh = Почти нет ударов. Плотность ниже, чем у воды, но выше, чем у мятного льда из нашей столовой.
	#KDEX_SD_MinmusInSpaceLowHighlands = На ионизированных частицах пыли обнаружены сульфатные покрытия.
	#KDEX_SD_MinmusInSpaceLowMidlands = Банка нашего прибора похожа на мятный сандей.
	#KDEX_SD_MinmusInSpaceLowLowlands = Результаты говорят о том, что осаждающиеся частицы отличаются по составу от тех, что остаются на большей высоте.
	#KDEX_SD_MinmusInSpaceLowSlopes = Низкий уровень пыли.
	#KDEX_SD_MinmusInSpaceLowGreatFlats = В отобранной пробе пыли нет частиц сульфата — признак отсутствия антропогенного загрязнения.
	#KDEX_SD_MinmusInSpaceLowGreaterFlats = Следы пыли гипса, кварца, NaCl (морская соль или минеральный галит), богатых кальцием частиц и карбонатов кальция.
	#KDEX_SD_MinmusInSpaceLowLesserFlats = Датчик показывает умеренную пыльную бурю.
	#KDEX_SD_MinmusInSpaceLowFlats = Состав частиц диаметром более 1 мм.
	#KDEX_SD_MinmusInSpaceLowPoles = На ионизированных частицах пыли покрытия не обнаружены.

	#KDEX_SD_GillyInSpaceLow = Пыль с силикатными ядрами ударяет в заднюю стенку прибора.
	#KDEX_SD_GillySrfLanded = Эти зёрна покрыты копотью из аморфного углерода.

	#KDEX_SD_MohoInSpaceLow = Плотность почти как у летучей золы.
	#KDEX_SD_MohoSrfLanded = Мелкий порошок из стеклянных сфер размером от субмикронных до более 100 микрон. Удельный вес 1,9–2,4, насыпная плотность 0,8–1 т/м³.

	#KDEX_SD_EveInSpaceLow = Пыль похожа на стекло. Приближаются сильные удары.
	#KDEX_SD_EveFlying = Сильные удары и высокая частота столкновений — настоящий стресс-тест.

	#KDEX_SD_DunaInSpaceLow = Размер поступающих зёрен — от десятых долей нанометра до нескольких микрон.
	#KDEX_SD_DunaSrfLanded = Пыль довольно зернистая, удары похожи на песчаные.

	#KDEX_SD_IkeInSpaceLow = Частиц пыли мало, и они редки.
	#KDEX_SD_IkeSrfLanded = В датчик попадает лишь несколько частиц пыли. Надо было взять лопату.

	#KDEX_SD_DresInSpaceLow = Пыль, похоже, состоит из углеродистых, силикатных и металлических зёрен.
	#KDEX_SD_DresSrfLanded = Пыль настолько плотная, что поглощает и рассеивает солнечный свет.

	#KDEX_SD_JoolInSpaceLow = Пыли нет либо её зёрна слишком малы для распознавания прибором.

	#KDEX_SD_LaytheInSpaceLow = Пыль пытается принять форму. Такое же поведение мы наблюдали у Кербина.
	#KDEX_SD_LaytheSrfLanded = Рыхлый сыпучий материал. Вероятно, состоит из карбоната кальция.
	#KDEX_SD_LaytheSrfSplashed = В датчик не попадает ни одного зерна.

	#KDEX_SD_VallInSpaceLow = Пыль пытается принять форму. Плотность ниже, чем у воды.
	#KDEX_SD_VallSrfLanded = Холод, похоже, удерживает частицы пыли на поверхности.

	#KDEX_SD_TyloInSpaceLow = Не стоит внимания: просто много пыли и сопротивления, в итоге ничего не значащих.
	#KDEX_SD_TyloSrfLanded = Из-за высокой гравитации пыль слипается в сферы.

	#KDEX_SD_BopInSpaceLow = Пыль собирается в плотные ядра.
	#KDEX_SD_BopSrfLanded = В датчике слишком много пыли.

	#KDEX_SD_PolInSpaceLow = Стереть здесь пыль было бы неплохим началом.
	#KDEX_SD_PolSrfLanded = Слабые удары. Вероятно, фосфорного или серного происхождения.

	#KDEX_SD_EelooInSpaceLow = Частиц пыли мало, и они редки.
	#KDEX_SD_EelooSrfLanded = Пыль состоит из CO, карбида кремния, аморфного силиката и большого количества льда.

	#KDEX_SD_SunInSpaceLow = Так близко к светилу частицы пыли лопаются в банке датчика, как попкорн. Может, из них выйдут Snacks?!
	#KDEX_SD_SunInSpaceHigh = Так далеко почти ни одна пылинка не долетает до датчика. Вы чувствуете себя одиноким и маленьким.
	}
}
