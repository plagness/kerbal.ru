// StockRT -- перевод методом PATCH (см. docs/MAINTAINING.md §2). StockRT сам не добавляет
// деталей, но переопределяет title/description ОДНОЙ существующей "детали" -- виртуального
// апгрейда RTPassiveAntennaTech из мода RemoteTech (заглушка под ветку техдерева, не имеет
// геометрии, category = -1). RemoteTech определяет title/description литералом ("Probe Core
// Upgrade" / "...within 3 km...", файл RemoteTech/RemoteTech_Tech_Node.cfg), а StockRT
// патчит их своими значениями через :AFTER[RemoteTech] ("Communication Tech" / "...within
// 100 km..."). В этой сборке RemoteTech поверх стока (не RSS) -- при живом запуске игры
// GameData/ModuleManager.ConfigCache подтверждает: активный текст -- именно вариант StockRT,
// он же ниже побайтово в блоке en-us. RemoteTech свою собственную заглушку не переводит
// (её translations/RemoteTech/Localization/ru.cfg этот part не задевает) -- перевод этой
// детали целиком принадлежит StockRT, т.к. только версия StockRT реально видна игроку
// при установленной сборке.
Localization
{
	en-us
	{
		#LOC_StockRT_RTPassiveAntennaTech_title = Communication Tech
		#LOC_StockRT_RTPassiveAntennaTech_description = Allows RemoteTech probe and command pods cores to contact ships within 100 km without the need for a dedicated antenna.
	}
	ru
	{
		#LOC_StockRT_RTPassiveAntennaTech_title = Технология связи
		#LOC_StockRT_RTPassiveAntennaTech_description = Позволяет зондам и командным модулям RemoteTech устанавливать связь с кораблями в пределах 100 км без выделенной антенны.
	}
}
